<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Cal Battery POC</title>
<style>
  html,body{margin:0;background:#111;color:#ddd;font:14px system-ui,sans-serif}
  #wrap{max-width:760px;margin:0 auto;padding:8px}
  #hdr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  #bld{font-weight:700;color:#fc6}
  .st{font-size:12px;padding:1px 8px;border-radius:8px;background:#333}
  .st.ok{background:#173f1e;color:#8f8}
  .st.bad{background:#4a1515;color:#f88}
  video{display:none}
  canvas#cam{width:100%;display:block;background:#000;border-radius:6px}
  #banner{font-weight:700;color:#fc6;font-size:16px;margin:6px 0;text-align:center;
          border:1px solid #663;border-radius:6px;padding:6px;background:#221a00}
  #progress{font:14px monospace;color:#fc6;margin:6px 0;white-space:pre-wrap}
  #btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  button{background:#2a2a3a;color:#dde;border:1px solid #444;border-radius:6px;
         padding:8px 14px;font-size:14px}
  button:disabled{opacity:.35}
  button.on{background:#1d3a5f;border-color:#3a7}
  #log{height:240px;overflow-y:auto;background:#0a0a0a;border:1px solid #333;
       border-radius:6px;font:11px/1.45 monospace;padding:6px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span id="bld">LED CAL BATTERY — <span id="bl2">…</span></span>
    <span class="st" id="wsst">WS: connecting</span>
    <span class="st" id="camstat">Cam: starting</span>
  </div>
  <div id="banner">CAL MODE — autonomous battery; starts on the CAL directive</div>
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cam" width="640" height="360"></canvas>
  <div id="progress">idle — battery starts on the CAL directive (cmds file)</div>
  <div id="btns">
    <button id="bStart" disabled>Start battery</button>
    <button id="bAbort" disabled>Abort</button>
    <button id="bSend" disabled>Send frames (all)</button>
    <button id="bLog" disabled>Download log</button>
  </div>
  <div id="log"></div>
</div>
<script>
'use strict';
window._onload = Date.now();      // fresh-context marker (survey-page lineage)
// ============================================================================
// CAL PAGE — autonomous calibration/self-test battery (S14R-0003-CAL).
// Served at https://192.168.4.1/cal (SECOND firmware route; same TLS + wss).
// A trimmed standalone sibling of page/survey.html: transport, paint and
// capture machinery are COPIES of the verified survey functions (do not
// mutate survey.html's code paths), plus a self-running battery controller.
// Wire protocol is UNCHANGED (JSON cmds + 246 B frame-bits + logc chunks);
// the survey page and its console decoders are untouched.
//
// Battery (default order E5,E1,E2,E3,E4, started by the CAL directive):
//   E1 L-ladder all-ON   paint rig-wide all-ON at L, hold solidMs, ~18
//                        snapshots at ~500 ms, per-step summary line
//   E2 duty compare      same ladder, 50%-duty paint = an exact coded
//                        plane's ON set (dutyBank = codeword row, default 0)
//   E3 settle sweep      single L jump 5->120 and 120->5, 12 s @ 250 ms trace
//   E4 union ladder      duty-0.5 dwell 2 s at L, then ONE REAL CWC burst
//                        (untouched paint primitives, master last, labels
//                        cwc:rN:...) so the console decoder works as-is
//   E5 idle AE trace     NO paint, 60 frames @ 1 s (room baseline + AE rest)
// Abort: the ABRT directive (or the page's Abort button) stops at the next
// step boundary; config rides CALCFG=<json> (cmds file, one-shot like CFG=).
// ============================================================================

const BUILD = "S14R-0003E-CAL";   // 0003E: tear thresholds re-tuned for the short-exposure
                                  // regime (thr 18→26, thrRed 6→8.5 — 0003D's live E4-only
                                  // battery @exp300.03 showed clean-max 13.4 vs cal-regime 10.6,
                                  // 61/96 regrabs) + benchPull now ships torn/tm meta (0003D
                                  // dropped the extras — flags never reached disk)
                                  // 0003C: benchPull splice fix — drop shipped prefix (re-ship storm ROOT CAUSE: store never cleared; survey clears at next-burst, battery loop has no boundary)
const $ = (id) => document.getElementById(id);

// ---------------- CFG (serial-tunable; SAME key names as survey.html) ------
// Only the keys this battery reads are present; applyCfg merges any subset.
const CFG = {
  evBias: -1,             // exposureCompensation bias (Android only; iOS: none)
  cwcN: 1600,             // LEDs mapped to codewords (clamped to rig at use)
  cwcSettle: 100,         // ms paint-ack -> grab (clamped >=70, holeGap floor)
  cwcPoi: 1,              // burst-start POI re-assert (iOS lever)
  cwcPoiX: 0.5,           // fallback normalized POI (CFG-settable; 0..1)
  cwcPoiY: 0.5,
  bProbeCoreMinLuma: 170, // blurred luma a pixel must clear = lamp core
  bProbeDelayMs: 2000,    // AE re-convergence spacing (probeMeasure lineage)
  waitSettleMs: 2000,     // fixed hold before a burst (survey 0002 semantics)
  // S14R-0003D E4 tear-guard overrides (null = use the TEAR defaults below;
  // set a NUMBER via CALCFG= to bench-tune without repacking, e.g.
  // CALCFG={"tearThr":26}; reset by writing the default number back):
  tearThr: null,          // luma max-row-jump -> torn (default TEAR.thr 18)
  tearThrRed: null,       // red-vs-luma divergence -> torn (default TEAR.thrRed 6)
  tearSkipTop: null,      // first scanned row (default TEAR.skipTop 120)
  tearRetries: null,      // regrab attempts per plane (default TEAR.retries 2)
};
// ---------------- CAL battery constants (overridable via CALCFG=<json>) ----
// Defaults = tools/tuning_s14r0002.json calBattery section.
const CAL = {
  order: ['E5', 'E1', 'E2', 'E3', 'E4'],         // battery sequence (default)
  e1Ladder: [5, 10, 20, 40, 60, 80, 100, 120, 150, 179],   // E1 all-ON ladder
  e2Ladder: [5, 10, 20, 40, 60, 80, 100, 120, 150, 179],   // E2 duty-0.5 ladder
  dutyBank: 0,            // E2: codeword ROW painting ON = LED ids whose code
                          // contains this plane (50% duty exact coded set;
                          // plane 0 of the bank = 300 of the first 600 LEDs)
  e4Ladder: [80, 100, 120, 150],                 // E4 ladder of real CWC bursts
  e4DutyBank: -1,         // E4 duty paint: -1 = COMPLEMENT of codeword plane 0
                          // (also exactly 50%; contrasts the e4 burst master)
  snapCount: 18,          // snapshots per ladder step (E1/E2)
  snapGapMs: 500,         // snapshot spacing ms (~8-9 s per ladder step)
  solidMs: 300,           // cwcSolidMs: ladder-step hold before snapshots
  dwellMs: 2000,          // E4 duty-0.5 dwell before the burst
  stepGapMs: 5000,        // ladder dwell at the NEXT paint (post-capture gap)
  e3Jump: [5, 120, 5],    // E3 jump legs (from -> to -> back)
  e3TraceMs: 12000,       // E3 trace length per leg
  e3GapMs: 250,           // E3 trace spacing (fine trace)
  idleCount: 60,          // E5 frames
  idleGapMs: 1000,        // E5 spacing
  e4GapMs: 10000,         // E4 gap between L values
  shipBatch: 4,           // incremental ship trigger (03 Oct storm: 24-frame batch @115200 relay ~90 s blew chunk acks; <=4 measured safe)
  snapJpegQ: 0.5,         // snapshot JPEG quality (survey parity)
  blobSegThr: 40,         // raw-core seg floor (threshold + components)
  blobMinPx: 4,           // component >= this pixel count counts as a blob
};
function calApplyCfg(j) { applyCfg(j); }   // alias kept for the cmds docs

// sticky CAL settings across reloads of the SAME build (survey pattern):
try {
  if (localStorage.getItem('calCfgBuild') === BUILD) {
    const saved = JSON.parse(localStorage.getItem('calCfg') || '{}');
    for (const key of Object.keys(saved)) {
      if (key in CFG && typeof saved[key] === 'number' && isFinite(saved[key])) CFG[key] = saved[key];
      else if (key in CAL && saved[key] !== null && typeof saved[key] !== 'function') CAL[key] = saved[key];
    }
  } else {
    localStorage.setItem('calCfgBuild', BUILD);
    localStorage.removeItem('calCfg');
  }
} catch (e) {}
window._saveCfg = () => { try { localStorage.setItem('calCfgBuild', BUILD);
  localStorage.setItem('calCfg', JSON.stringify(Object.assign({}, CFG, CAL))); } catch (e) {} };
// ---------------- CALCFG (the battery's config channel, cmds-file driven) --
// CALCFG=<json> rides the SAME box cfg slot (CFG= queues it), so the page's
// drv? poll delivers it as r.cfg; applyCfg merges numbers into CFG and everything
// else into CAL (arrays/strings welcome). The standing rig keys (nStr/nPerStr)
// ride the SAME json — one CFG= line sets rig + battery.
let calCfgLoaded = false;
function applyCfg(j) {
  if (!j) return;
  let o; try { o = JSON.parse(j); } catch (e) { log('E cfgparse'); return; }
  const touched = [];
  // rig keys: the page mirrors the box (survey-page semantics, same clamps)
  if (typeof o.nStr === 'number' && isFinite(o.nStr)) {
    const v = Math.max(1, Math.min(8, o.nStr | 0));
    if (v !== window._nStr) { window._nStr = v; touched.push('nStr=' + v); }
  }
  if (typeof o.nPerStr === 'number' && isFinite(o.nPerStr)) {
    const v = Math.max(1, Math.min(200, o.nPerStr | 0));
    if (v !== window._nPerStr) { window._nPerStr = v; touched.push('nPerStr=' + v); }
  }
  for (const k in o) {
    if (k in CFG && typeof o[k] === 'number' && isFinite(o[k])) { CFG[k] = o[k]; touched.push(k + '=' + o[k]); }
    else if (k in CAL) { CAL[k] = o[k]; touched.push(k + '=cal'); }
  }
  if (touched.length) log('calcfg ' + touched.join(','));
}


// ---------------- log ring (page-side; ships as logc) -----------------------
const LOG_MAX_LINES = 600;
const logRing = [];
const t0 = Date.now();   // one wall-clock origin for every timestamp (page run)
function log(s) {
  const dt = (Date.now() - t0) / 1000;
  const line = 't' + dt.toFixed(1).padStart(6) + ' ' + s;
  logRing.push(line);
  if (logRing.length > LOG_MAX_LINES) logRing.shift();
  const el = $('log');
  el.textContent = logRing.join('\n');
  el.scrollTop = el.scrollHeight;
}
function downloadLog() {
  const blob = new Blob([logRing.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cal_log_' + BUILD + '_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.txt';
  a.click();
  log('log downloaded (' + logRing.length + ' lines)');
}
// ---------------- WS: auto-connect, id-matched acks (survey VERBATIM) -------
let ws = null, wsOpen = false, cmdId = 0;
const pending = new Map();
let ackRetries = 0;
window._helloAt = 0;
function connectWS() {
  const url = 'wss://' + location.host + '/ws';
  log('ws connect ' + url);
  try { window._ws = new WebSocket(url); } catch (e) { log('E wsopen ' + e); scheduleReconnect(); return; }
  const ws = window._ws;
  ws.onopen = () => { wsOpen = true; $('wsst').textContent = 'WS: open'; $('wsst').className = 'st ok';
    sendCmd({ cmd: 'hello', build: BUILD }); };
  ws.onclose = () => { wsOpen = false; $('wsst').textContent = 'WS: closed'; $('wsst').className = 'st bad';
    for (const [id, p] of pending) { clearTimeout(p.timer); p.reject(new Error('ws closed')); }
    pending.clear(); scheduleReconnect(); };
  ws.onerror = () => { /* onclose follows */ };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.px !== undefined && m.fw === 'poc_survey') {
      if (!connectWS._helloDone) {
        connectWS._helloDone = true;
        window._helloAt = Date.now();
        window._npx = m.px;
        window._nStr = Math.max(1, Math.min(8, m.nStr | 0 || 1));
        window._nPerStr = Math.max(1, Math.min(200, m.nPerStr | 0 || 200));
        log('box hello fw=' + m.fw + ' px=' + m.px + ' nStr=' + window._nStr + ' nPerStr=' + window._nPerStr);
        setButtons();
      } else log('hello (dedup): rig ' + (m.nStr | 0 || 1) + 'x' + (m.nPerStr | 0 || 200) +
                 ' left as ' + window._nStr + 'x' + window._nPerStr);
    }
    if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id); clearTimeout(p.timer);
      ackRetries = 0;
      if (m.ok) p.resolve(m); else p.reject(new Error(m.err || 'nack'));
    }
  };
}
let reconnectAt = 0;
function scheduleReconnect() {
  const wait = Math.min(5000, 500 * Math.pow(2, reconnectAt++));
  log('ws retry in ' + wait + 'ms');
  setTimeout(() => { if (!wsOpen) connectWS(); }, wait);
}
function sendCmd(obj, opt) {
  return new Promise((resolve, reject) => {
    if (!wsOpen || !window._ws || window._ws.readyState !== 1) { reject(new Error('ws down')); return; }
    const id = ++cmdId;
    obj.id = id;
    const o = opt || {};
    const tries = o.tries || 2;
    const attempt = (left) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        if (left > 0) { log('ack retry id' + id); ackRetries++; attempt(left - 1); }
        else reject(new Error('ack timeout ' + obj.cmd));
      }, o.timeout || 2500);
      pending.set(id, { resolve, reject, timer });
      window._ws.send(JSON.stringify(obj));
    };
    attempt(tries);
  });
}


// ---------------- camera: robust auto-start, single rVFC pump ---------------
let stream = null, videoTrack = null, camReady = false, frameIdx = 0;
// Processing dimensions come from the TRACK's real aspect (portrait phone
// cameras report 720x1280-class sizes). Long side capped at 720 for CPU;
// short side scales to match, so nothing is ever squashed.
let W = 640, H = 360;
// CANVAS OWNERSHIP (bug class of S14P-1900/1903 — keep this rule intact:
//   procCx owns GRABS: every capture path reads procCx, only grab() draws it.
//   camCx owns DISPLAY: idle preview + overlays only.
const camCv = $('cam'), camCx = camCv.getContext('2d', { willReadFrequently: true });
const procCv = document.createElement('canvas');
const procCx = procCv.getContext('2d', { willReadFrequently: true });
function sizeForVideo(vw, vh) {
  if (!vw || !vh) return;
  const scale = Math.min(1, 720 / Math.max(vw, vh));
  W = Math.max(2, Math.round(vw * scale / 2) * 2);
  H = Math.max(2, Math.round(vh * scale / 2) * 2);
  procCv.width = W; procCv.height = H;
  log('proc ' + W + 'x' + H + ' (video ' + vw + 'x' + vh + ')');
}
let grabResolvers = [];            // rVFC-based grabs (single pump owns rVFC)

function startCamera() {
  $('camstat').textContent = 'Cam: requesting';
  const p = navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false });
  Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('gum 12s timeout')), 12000))])
    .then((s) => {
      stream = s;
      videoTrack = s.getVideoTracks()[0];
      const v = $('vid');
      v.srcObject = s;
      $('camstat').textContent = 'Cam: playing';
      return v.play();
    })
    .then(() => {
      const vv = $('vid');
      const vw = vv.videoWidth, vh = vv.videoHeight;
      log('cam live ' + vw + 'x' + vh + ' track=' + (videoTrack && videoTrack.label || '?'));
      sizeForVideo(vw, vh);
      camCv.width = W; camCv.height = H;   // display = processing aspect, no squash
      camReady = true; frameIdx = 0;
      $('camstat').textContent = 'Cam: live'; $('camstat').className = 'st ok';
      applyEvBias(); _evLastApplied =
        (typeof CFG.evBias === 'number' && isFinite(CFG.evBias)) ? CFG.evBias : -1;
      pump();
    })
    .catch((e) => {
      log('E cam ' + (e && e.name || e));
      $('camstat').textContent = 'Cam: retrying'; $('camstat').className = 'st bad';
      const t = setTimeout(startCamera, 8000);
      const kick = () => { clearTimeout(t); document.removeEventListener('visibilitychange', kick);
                           camCv.removeEventListener('touchstart', kick); startCamera(); };
      document.addEventListener('visibilitychange', kick);
      camCv.addEventListener('touchstart', kick);       // retry on any touch (gesture)
    });
}
let _evLastApplied = null;
function applyEvBias() {
  try {
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (caps && caps.exposureCompensation) {
      const target = Math.max(caps.exposureCompensation.min || -3, Math.min(CFG.evBias, caps.exposureCompensation.max || 3));
      videoTrack.applyConstraints({ advanced: [{ exposureCompensation: target }] })
        .then(() => log('ev bias ' + target)).catch((e) => log('ev bias failed'));
    } else log('ev: not exposed (iOS expected)');
  } catch (e) { log('ev probe failed'); }
}
// iOS runs POI-only (no evBias constraint); the cal page re-asserts the CFG
// POI at battery start (survey burst-start semantics, minus the crosshair).
async function applyPoi() {
  if (!videoTrack) return false;
  try {
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (!caps || !caps.pointsOfInterest) return false;
    const fx = Math.max(0, Math.min(1, CFG.cwcPoiX || 0.5));
    const fy = Math.max(0, Math.min(1, CFG.cwcPoiY || 0.5));
    await videoTrack.applyConstraints({ advanced: [{ pointsOfInterest: { x: fx, y: fy } }] });
    log('poi ' + fx.toFixed(2) + ',' + fy.toFixed(2));
    return true;
  } catch (e) { log('poi failed: ' + (e && e.message || e)); return false; }
}
function expLine() {
  try {
    const s = videoTrack.getSettings ? videoTrack.getSettings() : {};
    const parts = [];
    if (s.exposureTime != null) parts.push('exp=' + s.exposureTime);
    if (s.exposureMode) parts.push('aem=' + s.exposureMode);
    if (s.exposureCompensation != null) parts.push('ev=' + s.exposureCompensation);
    if (s.focusDistance != null) parts.push('fd=' + (+s.focusDistance).toFixed(2));
    return parts.join(' ');
  } catch (e) { return ''; }
}
// the frame pump: grabs served via rVFC; idle tick paints the preview ONLY
// when not scanning (cal page: battery running => scanning=true; the pump's
// camCx redraw must NOT interleave with procCx grabs — S14P-1903 rule).
function pump() {
  const v = $('vid');
  const step = () => {
    if (!camReady) return;
    frameIdx++;
    if (grabResolvers.length) {
      const rs = grabResolvers; grabResolvers = [];
      for (const r of rs) r();
    } else if (frameIdx % 6 === 0 && !scanning) idleFrame();
    requestVideoFrameCallbackOrTimeout(v, step, 200);
  };
  requestVideoFrameCallbackOrTimeout(v, step, 200);
}
function requestVideoFrameCallbackOrTimeout(v, fn, ms) {
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => fn());
  else setTimeout(fn, 33);
}
function grab() {
  return new Promise((resolve) => {
    const v = $('vid');
    if (v.requestVideoFrameCallback) {
      grabResolvers.push(() => { procCx.drawImage(v, 0, 0, W, H); resolve(); });
    } else {
      setTimeout(() => { procCx.drawImage(v, 0, 0, W, H); resolve(); }, 100);
    }
  });
}
function grabTimeout() {
  return Promise.race([grab(), new Promise((_, rej) => setTimeout(() => rej(new Error('rVFC starved')), 3000))]);
}
function idleFrame() {          // 10 Hz idle preview (only when not scanning)
  if (!camReady) return;
  try {
    camCx.drawImage($('vid'), 0, 0, W, H);
  } catch (e) { /* preview is best-effort */ }
}

// 246 B — [0]='B' [1]=ver=1 [2]=b [3]=flags=0 [4..5]=u16 LE epoch [6..245]=
// bit-plane, 1920 bits, bit j = global LED id j, LSB-first per byte.
function frameBitsPaint(bitsOrNull, b, epoch) {
  return new Promise((resolve, reject) => {
    if (!wsOpen || !window._ws || window._ws.readyState !== 1) { reject(new Error('ws down')); return; }
    const msg = new Uint8Array(246);
    msg[0] = 0x42;                          // 'B'
    msg[1] = 1;                             // ver
    msg[2] = b & 255;                       // brightness
    msg[3] = 0;                             // flags
    msg[4] = epoch & 255; msg[5] = (epoch >> 8) & 255;   // u16 LE epoch
    if (bitsOrNull) msg.set(bitsOrNull, 6); // 240 B payload
    const id = epoch;                       // ack matcher key
    const timer = setTimeout(() => { pending.delete(id); reject(new Error('ack timeout frame-bits')); }, 2500);
    pending.set(id, { resolve, reject, timer });

}

//   rows  = full H (no y-collapse; a tear is a 1-px row event)
//   cols  = W/7 block-mean collapse (luma + red channel row means)

function tearScan() {
  const xb = 7;
  const d = procCx.getImageData(0, 0, W, H).data;
  const cols = Math.max(1, (W / xb) | 0);
  const lum = new Float64Array(H), red = new Float64Array(H);
  for (let y = 0; y < H; y++) {
    let sl = 0, sr = 0;
    const row = y * W * 4;

      for (let k = 0; k < xb; k++) {             // block-mean collapse (area)

const calState = { running: false, phase: 'idle', exp: null, step: 0,

// per-step summary line (CWCSTATS-style): whole-frame histMed page-parity with
// the CWCSTATS recipe (histMedian over lumaOf), plus raw-core P90 over
// self-segmented bright blobs (threshold + 4-conn components on the snapshot)
// and the blob count. Ships as `CALSTATS {kind:'step', ...}` logc line.
function calStepStats(imgData, label) {
  const d = imgData.data, n = W * H;
  const lum = new Float32Array(n);
  const hist = new Uint32Array(256);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = d[p], g = d[p + 1], bl = d[p + 2];
    const l = r > g ? (r > bl ? r : bl) : (g > bl ? g : bl);   // max(r,g,b)
    lum[i] = l; hist[l]++;
  }
  let acc = 0, hm = 0;                       // histMed = CWCSTATS recipe parity
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > (n >> 1)) { hm = v; break; } }
  // self-segmented bright blobs: fixed threshold, 4-conn flood fill
  const thr = CAL.blobSegThr | 0 || 40;
  const minPx = CAL.blobMinPx | 0 || 4;
  const seen = new Uint8Array(n);
  const stack = new Int32Array(n);
  let blobs = 0;
  const coreVals = [];
  for (let s0 = 0; s0 < n; s0++) {
    if (seen[s0] || lum[s0] < thr) continue;
    let sp = 0; stack[sp++] = s0; seen[s0] = 1;
    let cnt = 0, peak = 0;
    while (sp > 0) {
      const idx = stack[--sp];
      cnt++;
      const v = lum[idx];
      if (v > peak) peak = v;
      const x = idx % W, y = (idx / W) | 0;
      if (x > 0 && !seen[idx - 1] && lum[idx - 1] >= thr) { seen[idx - 1] = 1; stack[sp++] = idx - 1; }
      if (x < W - 1 && !seen[idx + 1] && lum[idx + 1] >= thr) { seen[idx + 1] = 1; stack[sp++] = idx + 1; }
      if (y > 0 && !seen[idx - W] && lum[idx - W] >= thr) { seen[idx - W] = 1; stack[sp++] = idx - W; }
      if (y < H - 1 && !seen[idx + W] && lum[idx + W] >= thr) { seen[idx + W] = 1; stack[sp++] = idx + W; }
    }
    if (cnt >= minPx) { blobs++; coreVals.push(peak); }
  }
  coreVals.sort((a, b) => a - b);
  const q = (arr, p) => arr.length ? arr[Math.min(arr.length - 1, (p * arr.length) | 0)] : 0;
  return { label, histMed: hm, coreP90: q(coreVals, 0.90), blobs, nCores: coreVals.length };
}

async function probeMeasure(b) {

  await grabTimeout();

  const n = W * H, px = d.data;
  const hist = new Uint32Array(256);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = px[p], g = px[p + 1], bl = px[p + 2];
    const l = r > g ? (r > bl ? r : bl) : (g > bl ? g : bl);   // max(r,g,b)

  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > (n >> 1)) { hm = v; break; } }

  // per-core value; clip = cores >= 252; ring bg from the coarser blur.

    lum[i] = r > g ? (r > bl ? r : bl) : (g > bl ? g : bl);
  }

  const blurPass = (src) => {
    const t = new Float32Array(n), o = new Float32Array(n);
    for (let y = 0; y < H; y++) for (let x = 1; x < W - 1; x++)
      t[y * W + x] = (src[y * W + x - 1] + src[y * W + x] + src[y * W + x + 1]) / 3;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++)
      o[y * W + x] = (t[(y - 1) * W + x] + t[y * W + x] + t[(y + 1) * W + x]) / 3;
    return o;

  for (let y = 4; y < H - 4; y += step) {
    for (let x = 4; x < W - 4; x += step) {

  const q = (arr, p) => arr.length ? arr[Math.min(arr.length - 1, (p * arr.length) | 0)] : 0;

  let clipN = 0;
  for (const c of cores) if (c >= 252) clipN++;
  const clipPct = cores.length ? 100 * clipN / cores.length : 0;
  return { b, P90, clipPct, histMed: hm,

      await shipLine('CALSTATS', Object.assign({ kind: 'step', exp: 'E3', jump:
        from + '->' + to, traceMs, gapMs, snaps: k },
        calStepStats(procCx.getImageData(0, 0, W, H), 'cal:E3:' + from + 'to' + to),
        { expReadback: expLine() }));
    // settle back before the next jump leg
    let w = 0; while (w < 2000 && !calState.abortFlag) { await sleep(20); w += 20; }
  }
  return !calState.abortFlag;
}


// ---------------- E4: union ladder (real CWC bursts, labels UNTOUCHED) -------
// E4-ONLY CMDS STAGING (S14R-0003D; standing rule: ONE directive per cmds
// file, CALCFG staged BEFORE the page connects — mid-session delivery is
// unreliable, the 2-credit cfg slot drains on the boot-time polls):
//   cmds/e4_only_1_cfg.txt:
//     CFG={"cwc":1,"cwcN":600,"nStr":3,"nPerStr":200,"cwcSuppress":1,"cwcMaskThr":100,"cwcAmpGate":40,"cwcMarginGate":6}
//   cmds/e4_only_2_calcfg.txt:
//     CALCFG={"order":["E4"],"e4Ladder":[80,100,120,150],"dwellMs":2000,"e4GapMs":10000,"e4DutyBank":-1}
//   cmds/e4_only_3_start.txt:
//     CAL
// Code-trace verdict (0003D, no page fix needed): calBattery() iterates
// CAL.order — for "E4" it calls ONLY expE4(); every primitive it reads is
// either battery-scope (benchRunBase from localStorage calBatteryNo, benchRunNo
// = base+e4Idx, lumaOf/W/H, calDutyBits/cwcPlanePaint/frameBitsPaint) or
// CFG/CAL constants applied from this CALCFG. NOTHING reads state written by
// expE1/E2/E3 (their stores ship via the same shipIfDue between experiments;
// skippping them leaves nothing dangling) and NO code special-cases
//    CAL.order.length (CALSTATS kind:battery at the end echoes the order given).
// Epoch increments from localStorage (not from the order list), labels stay
// cwc:rN:pNN / cwc:rN:master per burst, the whole epoch ships at experiment
// end via shipIfDue(true), splice-fixed (0003C). Verified the same way for
// expE1/E2/E3/E5 — order may be ANY subset/sequence of the five.
// duty paint: e4DutyBank -1 = complement of codeword plane 0 (exactly 50%);
// cwcN rides the rig CFG line (cwcN>=1 always at rig>=1x1; CFG.cwcN|0||600
// is a syntax fallback only). Optional extra keys: cwcSettle, cwcPoiX/Y, and
// the tear-guard overrides CFG.tearThr / tearThrRed / tearSkipTop /
// tearRetries (numbers; null = compiled default — any other type is ignored
// by applyCfg and the default stands).
// duty-0.5 probe-style dwell 2 s at L, then ONE REAL 24-plane CWC burst using
// the EXISTING burst primitive (24 binary frame-bits planes + master last via
// cmd 'all' at the SAME L) with the survey run label space cwc:rN:* so the
// console decoder (cwc_pos_decode.py) works as-is on these runs. NO probe
// here (the ladder L IS the probe's final L for that run) and no decode in
// page — frames ship raw for the console.
async function expE4() {
  calState.exp = 'E4';
  progress('E4 union ladder CWC bursts: ' + (CAL.e4Ladder || []).join(','));
  const maxB = Math.min(255, Math.floor(510 / (Math.max(1, window._nPerStr) * 0.0142)));
  let e4Idx = 0;
  for (const L0 of (CAL.e4Ladder || [])) {
    if (calState.abortFlag) return false;
    const L = Math.max(20, Math.min(maxB, L0 | 0 || 120));
    benchRunNo = benchRunBase + e4Idx;         // survey-label run tag: cwc:rN
                                                // (benchRunBase = battery epoch:
                                                // no reload label collisions)
    const nL = Math.max(10, Math.min(paintCap(), CFG.cwcN | 0 || 600));
    // duty-0.5 dwell (probe-style): coded plane at L for dwellMs, no capture
    const settleClamp = (ms) => Math.max(70, ms | 0 || 70);
    await frameBitsPaint(calDutyBits(Math.max(1, Math.min(nL, 1600)), CAL.e4DutyBank),
                         L, ++cmdId);
    log('e4 dwell: duty plane at L=' + L + ' for ' + (CAL.dwellMs | 0 || 2000) + 'ms');
    let held = 0; const dw = CAL.dwellMs | 0 || 2000;
    while (held < dw && !calState.abortFlag) { await sleep(20); held += 20; }
    if (calState.abortFlag) break;
    // ---- ONE REAL CWC burst: EXISTING primitives, protocol untouched ----
    log('cwc burst: 24 frame-bits planes -> master(fast), ' + nL +
        ' leds (rig ' + rigCap() + '), b=' + L);
    const grabPlane = () => grabTimeout().then(() => lumaOf(procCx.getImageData(0, 0, W, H)));
    // TEAR GUARD (S14R-0003D): each plane is grabbed, scanned (tearScan),
    // and on a tear the SAME plane is re-painted and re-grabbed (up to
    // TEAR.retries). Preference is a silent replace — label/sequence stay
    // clean and the console decodes the run as-is; only a plane still torn
    // after the last retry ships with torn:1 INSIDE its FRAME meta
    // (decode_frames writes the meta object verbatim to <label>.meta.json,
    // so the flag survives to analysis with zero daemon changes).
    const tearGrabPlane = async (p) => {
      let m = { jL: 0, jR: 0 }, torn = false, tries = 0;
      for (;;) {
        await frameBitsPaint(cwcPlanePaint(p, nL, L), L, ++cmdId);  // ONE binary msg/plane
        const settle = p === 0 ? 1000 : settleClamp(CFG.cwcSettle);
        const tS = Date.now();
        while (Date.now() - tS < settle && !calState.abortFlag) await sleep(10);
        await grabTimeout();
        m = tearScan();                    // row-discontinuity metric on the grab
        torn = (m.jL >= (tearGet('thr') | 0)) || (m.jR >= (tearGet('thrRed') | 0));
        if (!torn || tries >= (tearGet('retries') | 0) || calState.abortFlag) break;
        tries++;
        tearLog('plane ' + String(p).padStart(2, '0') +
                ' regrab (metric=jL' + m.jL + '/jR' + m.jR + ', try ' + tries + '/' +
                (tearGet('retries') | 0) + ')');
      }
      return { m, torn, tries };
    };
    const planes = [];
    for (let p = 0; p < 24 && !calState.abortFlag; p++) {
      const tg = await tearGrabPlane(p);          // paint -> settle -> grab -> scan
      const lbl = 'cwc:r' + benchRunNo + ':p' + String(p).padStart(2, '0');
      benchCapture(lbl, tg.torn ? { torn: 1, tm: tg.m } : null);
      if (tg.torn) tearLog('plane ' + String(p).padStart(2, '0') +
                ' SHIPPED FLAGGED (metric=jL' + tg.m.jL + '/jR' + tg.m.jR +
                ', tries=' + tg.tries + ')');
      planes.push(lumaOf(procCx.getImageData(0, 0, W, H)));
    }
    if (!calState.abortFlag) {
      // MASTER: fast all-on grab before the AE meter re-adjusts (survey parity)
      await paint({ cmd: 'all', b: L });
      await sleep(70);
      const cwcMst = await grabPlane();
      benchCapture('cwc:r' + benchRunNo + ':master');
      // CWCSTATS-style summary line for this run (console reads the label)
      const stats = { build: BUILD, n: planes.length + 1, comp: 0,
                      mode: 'calE4', L, nStr: window._nStr, nPerStr: window._nPerStr,
                      histMed: histMedian(cwcMst), probeIters: 0,
                      steps: [], expAtBurst: expLine() };
      await shipLine('CWCSTATS', stats);
    }
    await paint({ cmd: 'black' });
    // 10 s gap between L values
    e4Idx++;
    let w = 0; const gw = CAL.e4GapMs || 10000;
    while (w < gw && !calState.abortFlag) { await sleep(50); w += 50; }
  }
  return !calState.abortFlag;
}
// ---------------- E5: idle AE trace (no paint) ------------------------------
async function expE5() {
  calState.exp = 'E5';
  progress('E5 idle AE trace: ' + (CAL.idleCount | 0 || 60) + ' frames @' +
           (CAL.idleGapMs | 0 || 1000) + 'ms');
  await paint({ cmd: 'black' });               // ensure the rig is DARK
  let held = 0; while (held < 2000 && !calState.abortFlag) { await sleep(20); held += 20; }
  for (let k = 0; k < (CAL.idleCount | 0 || 60) && !calState.abortFlag; k++) {
    const t0s = Date.now();
    await calSnap('cal:idle:' + String(k).padStart(2, '0'));
    if (benchStore.length >= (CAL.shipBatch | 0 || 4)) await shipIfDue(false);
    const spent = Date.now() - t0s;
    if (spent < (CAL.idleGapMs | 0 || 1000)) {
      let w2 = 0; const wait = (CAL.idleGapMs | 0 || 1000) - spent;
      while (w2 < wait && !calState.abortFlag) { await sleep(20); w2 += 20; }
    }
  }
  if (!calState.abortFlag)
    await shipLine('CALSTATS', Object.assign({ kind: 'step', exp: 'E5',
      snaps: CAL.idleCount | 0 || 60, gapMs: CAL.idleGapMs | 0 || 1000 },
      calStepStats(procCx.getImageData(0, 0, W, H), 'cal:idle'),
      { expReadback: expLine() }));
  return !calState.abortFlag;
}


// ---------------- ship the frame store (survey benchPull copy, CAL labels) --
async function benchPull() {
  if (benchPulling) return;
  benchPulling = true;
  let shipped = 0;                 // 0003C: fully-relayed frame count
  try {
    log('cal ship: ' + benchStore.length + ' frames');
    for (const f of benchStore) {
      const meta = JSON.stringify({ t: f.t, label: f.label, W: f.W, H: f.H,
                                    exp: f.exp,
                                    torn: f.torn, tm: f.tm });
      await sendCmd({ cmd: 'logc', d: 'FRAME ' + meta }, { tries: 2, timeout: 2000 });
      await sleep(30);
      for (let i = 0; i < f.jpg.length; i += 900) {
        await sendCmd({ cmd: 'logc', d: 'FJPEG ' + f.jpg.slice(i, i + 900) },
                      { tries: 2, timeout: 2000 });
        await sleep(20);
      }
      await sendCmd({ cmd: 'logc', d: 'FEND' }, { tries: 2, timeout: 2000 });
      await sleep(30);
      if (abortFlag || calState.abortFlag) break;
      shipped++;
    }
    await sendCmd({ cmd: 'logend' }, { tries: 2, timeout: 2000 });
    log('cal ship done: ' + shipped + ' sent');
    // 0003C FIX — the 4/5/6… re-ship storm's root cause: drop the SHIPPED
    // prefix so the next trigger ships only new frames. The survey page
    // never needed this (benchRun clears leftovers at the next burst start,
    // survey :1093) but the battery loop has no such boundary: without the
    // clear every shipIfDue re-shipped the whole store (24→25→26… 03 Oct
    // 22:19, 04 Oct 09:0x+09:3x). Abort/exception keeps the rest for a
    // later full re-ship (conservative: nothing is lost, nothing repeats).
    benchStore.splice(0, shipped);
  } catch (e) { log('E calship ' + (e && e.message || e)); }
  benchPulling = false;
}
// incremental ship between steps: frames leave in SMALL batches so the box
// never holds a full battery's stores (S14L lesson: the WS-heap squeeze) and
// a crash mid-battery keeps everything already shipped.
async function shipIfDue(force) {
  if (benchPulling || benchUploading) return;
  if (!benchStore.length) return;
  if (!force && benchStore.length < (CAL.shipBatch | 0 || 4)) return;
  calProgress('ship ' + benchStore.length + ' frames');
  benchUploading = true;
  try { await benchPull(); } catch (e) { log('E shipifdue ' + (e.message || e)); }
  benchUploading = false;
  calProgress('ship done: battery continues');
}
function calProgress(s) {
  calState.phase = s;
  progress('CAL ' + (calState.exp || '?') + ': ' + s + ' (run r' + benchRunNo + ')');
}
// ---------------- module state (survey parity names) ------------------------
let abortFlag = false;          // ship-loop break flag (survey parity)
let scanning = false;           // idle-preview + status-LED gate (survey parity)
let benchRunBase = 0;           // battery epoch (localStorage-backed; E4 r tags)
let benchRunning = false;       // battery running latch (survey-parity name)
// ---------------- MAIN BATTERY RUNNER (self-running after CAL) --------------
async function calBattery() {
  if (calState.running || benchRunning) return;
  if (!wsOpen || !camReady) { log('E cal: not ready'); return; }
  calState.running = true;
  benchRunning = true;
  calState.abortFlag = false;
  abortFlag = false;
  scanning = true;                 // freeze the idle preview; LED dark via drv? poll
  setButtons();
  const startedAt = Date.now();
  try {
    applyPoi();                    // burst-start POI re-assert (survey semantics)
    // battery epoch: persistent counter in localStorage -> E4 cwc:rN tags grow
    // monotonically across reloads (label-collision trap, HANDOFF §5)
    benchRunBase = parseInt(localStorage.getItem('calBatteryNo') || '0', 10) + 1;
    localStorage.setItem('calBatteryNo', String(benchRunBase));
    benchRunNo = benchRunBase;
    log('battery: build ' + BUILD + ' epoch r' + benchRunBase +
        ' CFG ' + JSON.stringify(CFG));
    log('battery: CAL ' + JSON.stringify(Object.assign({}, CAL)));
    calProgress('start, order ' + (CAL.order || []).join('->'));
    for (const en of (CAL.order || [])) {
      if (calState.abortFlag) break;
      const fn = { E1: expE1, E2: expE2, E3: expE3, E4: expE4, E5: expE5 }[en];
      if (!fn) { log('E battery: unknown experiment ' + en); continue; }
      await fn();
      await shipIfDue(true);       // ship everything between experiments
    }
    await paint({ cmd: 'black' });           // rig DARK at battery end
    const mins = ((Date.now() - startedAt) / 60000).toFixed(1);
    await shipLine('CALSTATS', { kind: 'battery', build: BUILD,
      order: CAL.order || [], done: !calState.abortFlag, mins: +mins,
      rig: window._nStr + 'x' + window._nPerStr, cwcN: CFG.cwcN | 0 });
    calProgress(calState.abortFlag ? 'ABORTED at ' + mins + 'min' : 'complete ' + mins + 'min');
    log('battery ' + (calState.abortFlag ? 'aborted' : 'complete') + ' in ' + mins + ' min');
  } catch (e) { log('E battery ' + (e && e.message || e)); }
  calState.running = false;
  benchRunning = false;
  calState.phase = 'idle';
  scanning = false;
  setButtons();
}
// ---------------- battery start via the CAL directive (poll) ---------------
// CAL rides the ONE-SHOT sDrv slot exactly like BURST/PROBE; CALCFG rides the
// 2-credit cfg slot (delivered to applyCfg BEFORE the directive — same order
// the console already relies on for burst CFG keys).
async function pollDrvOnce() {
  const r = await sendCmd({ cmd: 'drv?' }, { tries: 1, timeout: 1500 });
  wsOpen = true;
  drvPollFail = 0;
  if (r.cfg) applyCfg(r.cfg);              // rig CFG + CALcfg: BEFORE directives
  const d = r.drv || '';
  if (d === 'CAL') {
    if (calState.running) { log('CAL ignored: battery already running'); }
    else { log('CAL directive: battery start'); calBattery(); }   // no await: poll continues
  } else if (d === 'ABRT') {
    log('CAL ABRT (directive)'); calState.abortFlag = true; abortFlag = true;
    paint({ cmd: 'black' }).catch(() => {});
  } else if (d === 'BRAMP') {
    benchPull();                            // manual re-pull (survey-parity direct)
  } else if (d !== '') {
    log('drv ' + d + ' (no cal-page handler)');
  }
}
let drvPollFail = 0;
async function pollDrv() {
  try {
    await pollDrvOnce();
  } catch (e) {
    try { await pollDrvOnce(); }
    catch (e2) {
      wsOpen = false; setButtons();
      if (++drvPollFail % 8 === 0) log('drv? failed x' + drvPollFail + ' (' + (e2.message || e2) + ')');
    }
  }
}
setInterval(pollDrv, 1500);

// ---------------- button handlers (defined before boot) ---------------------
$('bStart').onclick = () => { if (wsOpen && camReady) calBattery(); };
$('bAbort').onclick = () => { calState.abortFlag = true; abortFlag = true; log('abort requested'); };
$('bSend').onclick = () => { if (!benchPulling && !benchUploading) { benchUploading = true;
  benchPull().finally(() => { benchUploading = false; setButtons(); }); } };
$('bLog').onclick = downloadLog;
// ---------------- wake lock + boot (survey pattern) ------------------------
async function requestWake() {
  try {
    if ('wakeLock' in navigator) {
      window._wakeLock = await navigator.wakeLock.request('screen');
      log('wake lock acquired');
      window._wakeLock.addEventListener('release', () => { window._wakeLock = null; log('wake lock released'); });
    } else log('wake lock not supported — set Auto-Lock=Never');
  } catch (e) { log('E wakelock ' + (e.message || e)); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && window._wakeLock === null) requestWake();
});
window._wakeLock = null;           // re-acquired on visibilitychange
// BOOT CALLS — very end of script (TDZ rule; B118 lesson)
$('bl2').textContent = BUILD;
connectWS();
startCamera();
requestWake();
</script>
