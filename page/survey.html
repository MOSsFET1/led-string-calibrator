<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Survey POC</title>
<style>
  html,body{margin:0;background:#111;color:#ddd;font:14px system-ui,sans-serif}
  #wrap{max-width:760px;margin:0 auto;padding:8px}
  #hdr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  #bld{font-weight:700;color:#8cf}
  .st{font-size:12px;padding:1px 8px;border-radius:8px;background:#333}
  .st.ok{background:#173f1e;color:#8f8}
  .st.bad{background:#4a1515;color:#f88}
  video{display:none}
  canvas#cam{width:100%;display:block;background:#000;border-radius:6px}
  #strip{font:12px/1.5 monospace;color:#7d7;margin:4px 0;white-space:pre-wrap}
  #btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  button{background:#2a2a3a;color:#dde;border:1px solid #444;border-radius:6px;
         padding:8px 14px;font-size:14px}
  button:disabled{opacity:.35}
  button.on{background:#1d3a5f;border-color:#3a7}
  #log{height:280px;overflow-y:auto;background:#0a0a0a;border:1px solid #333;
       border-radius:6px;font:11px/1.45 monospace;padding:6px;white-space:pre-wrap}
  #cfgline{font:11px monospace;color:#889;margin:4px 0}
  #burstRow{margin:6px 0}       /* S14R-0001: Burst directly under the camera */
  #strRow button{min-width:34px;padding:6px 8px}  /* one-press string count */
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span id="bld">LED Survey POC — <span id="bl2">…</span></span>
    <span class="st" id="wsst">WS: connecting</span>
    <span class="st" id="camst">Cam: starting</span>
  </div>
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cam" width="640" height="360"></canvas>
  <!-- S14R-0001 (operator UI): Burst sits DIRECTLY UNDER the camera image -->
  <div id="burstRow"><button id="bBurst" disabled>Burst</button></div>
  <div id="strip">…</div>
  <div id="cfgline">cfg: —</div>
  <div style="display:flex;gap:8px;align-items:center;margin:4px 0">
    <label for="npx" style="font-size:13px">LEDs:</label>
    <input id="npxin" type="number" min="1" max="200" value="200"
           style="width:80px;background:#1a1a1a;color:#dde;border:1px solid #444;border-radius:4px;padding:4px 6px">
    <span style="font-size:11px;color:#889">(box default applied on connect)</span>
  </div>
  <!-- S14R-0001 (operator UI): one row, 8 buttons = one-press string count.
       The BOX CFG path (nStr in CFG JSON via drv? replay) still owns
       automated runs — these apply an operator override mid-session. -->
  <div id="strRow" style="display:flex;gap:5px;align-items:center;margin:4px 0">
    <label style="font-size:13px">Strings:</label>
    <button id="bStr1">1</button><button id="bStr2">2</button><button id="bStr3">3</button>
    <button id="bStr4">4</button><button id="bStr5">5</button><button id="bStr6">6</button>
    <button id="bStr7">7</button><button id="bStr8">8</button>
  </div>
  <div id="btns">
    <button id="bAbort" disabled>Abort</button>
    <button id="bAll" disabled>All-on</button>
    <button id="bOff" disabled>Off</button>
    <input id="chkCapOnly" type="checkbox" style="vertical-align:middle"> <label for="chkCapOnly"
      style="font-size:11px;color:#889;vertical-align:middle">Capture only</label>
    <button id="btnSendFrames" disabled>Send frames (all)</button>
    <button id="bLog" disabled>Download log</button>
  </div>
  <div id="log"></div>
</div>
<script>
'use strict';
window._onload = Date.now();      // S14P-1926 probe: boot ran (fresh context marker)
// LED Survey POC — F1: survey frame + exposure study + reusable blob detector.
// New paradigm (STRATEGY-RESEARCH.md): identity will live in coded light
// patterns, not sequential tracking. This build: machinery + one-shot survey
// of all-on + accent frames, with a detector every later feature reuses.
// Deliberately ABSENT (never reliably worked; made unnecessary): phone->box
// log shipping, pause/resume, session state. One feature at a time.

const BUILD = "S14R-0001";
const $ = (id) => document.getElementById(id);

// ---------------- CFG (serial-tunable, applied on drv? poll) ---------------
// S1-S13 survey constants REMOVED (27 Sep). Standing: all-on/accents for the
// manual buttons, evBias, mergeR (the CWC pile-up's blob merge), and the
// S14 burst keys. Nothing here is survey-specific any more.
const CFG = {
  allB: 160,      // All-on button brightness 0-255
  accB: 200,      // legacy CFG echo key (accent survey removed); no reader
  evBias: -1,     // exposureCompensation bias (Android only; iOS: none)
  mergeR: 6.0,    // blob merge (detectDiffBlobs, the CWC pile-up reader):
                  // Sep 24 bright-room ladder: MONOTONE 28/5-6/3 fallbacks
                  // at 2/4/6 (dim flat); 6 = optimal bright, = 2 in dim
  bBurstN: 20,        // frames per all-on movement burst (2-40)
  bBurstGap: 0,       // ms pacing floor between grab STARTS (0 = as fast as
                      // the camera delivers; try 200 to test 5 fps demand)
  bBurstHold: 1000,   // ms all-on hold before frame 1 (AE settle)
  bBurstB: 150,       // all-on brightness for the burst (150 = 1600-px-safe
                      // per the polyfuse ladder; 150-px string could take more)
  bComp: 0,           // 1 = S14A2 drift compensation: per-frame seeded NCC
                      // estimate vs the burst master, warp the stored frame
                      // back (bilinear), ship measured shifts in BSTATS
  // --- S14R-0000 CWC-form burst (master + 24 Golay planes, NO off frame) ---
  // --- S14P-1923 multi-string rig (plan §6): hello nStr/nPerStr mirror the
  //     box CFG channel; cwcN clamps to nStr*nPerStr so global LED ids 0..
  //     cwcN-1 stay on the rig ---
  cwc: 1,             // 1 = CWC-form burst (the survey). 0 = all-on movement burst.
  cwcN: 1600,         // S14P-1927: default = the FULL RIG (8x200); still clamped
                      // to nStr*nPerStr at burst start, so partial/bench rigs
                      // map just the ids they have (global leds 10..1600 range)
  cwcSettle: 100,     // ms paint-ack -> grab (holeGap floor lesson: <70 flaky)
  // --- in-page position decode gates (console cwc_pos_decode recipe) ---
  // S14P-1927: PROMOTED DEFAULTS — sweep-validated 02 Oct across 5 handheld
  // sets — gains on every set, zero total regressions; suppress stays 1,
  // fullres on.
  cwcAmpGate: 40,     // min per-codeword amplitude (stacksig score / 12;
                      // amp normalisation follows the bank weight — 9-of-18
                      // era divided by 9); sweep values are per-plane means
  cwcMarginGate: 6,   // min d8 margin (score minus best confusable competitor;
                      // the 12-of-24 Golay bank keeps d_min 8, so competitor
                      // pairs are judged at d >= 8 — see cwcDecode's margin
                      // filter); sweep values measured on the 9-of-18 d6 bank
  cwcSuppress: 1,     // per-LED suppression radius in px after greedy accept (3 px window)
  cwcMaskThr: 100,    // candidate sites: blurred-master luma >= this;
                      // sweep-validated 02 Oct across 5 handheld sets (was 150).
                      // DO NOT raise to 175: edge/shallow-angle LEDs
                      // (documented 20-25 and 150-156 class) sit at 184-191.
                      // 30 Sep: 150 validated offline on tripod + flagged
                      // handheld run; codeword-103 phantom
                      // re-measured amp ~40 at current margins — revisit if
                      // gates change (sweep history: 200 excluded the
                      // shallow-angle edge cores of leds 20-25 + tail 150-156
                      // whose true sites score far ABOVE the gates but
                      // blur-luma 184-191)
  // --- Single-LED toggle test (cwcTestMode=1) ---
  cwcTestMode: 0,     // 0 = normal CWC; 1 = P00 1s -> P01..P23 -> fast master
  cwcTestLed: 0,      // LED index to track (0..cwcN-1)
  // --- Handheld health guard (1909; forensics 30 Sep on s14p-1908):
  //     motion-degraded bursts lose bimodality and gate-pass ghosts at the
  //     noise floor (39 vs page 118 on one burst). Flag per plane:
  //     chain conf (tripod 0.95 vs handheld-degraded 0.57-0.81) and chain
  //     remainder px (budget 5; that burst ran 3-9.5 med 4.5). Any flagged
  //     plane => amber warning line + box count shown amber in the title.
  cwcGuardConf: 0.65,   // direct-registration conf floor. Passing handheld
                        // measured 0.728–0.898 (r3/r4); 1908 degraded went to
                        // 0.57. The old 0.90 theme was the chain-era tripod
                        // number and flagged every decent handheld round.
  cwcGuardRem: 24,     // absolute offset vs master, px. Small handheld
                        // drift can reach ~20 px and still decode; flag only
                        // when well outside the recoverable budget.
  cwcGuardStep: 10,    // max successive plane-to-plane step, px. Catches
                        // sudden jerks without flagging slow drift.
                        // (1911 changed the quantity from chain remainder.)
  cwcNccPeakMargin: 0.05, // peak-vs-shoulder conditioning floor for the
                          // parabolic sub-peak; below -> keep integer pick
                          // (measured: tripod margins med 0.176/min ~0.17,
                          // degraded handheld med 0.045 -> refused there)
  cwcAeLock: 0,        // best-effort: lock AE after master+p00 (manual exposure)
                       // Android may support it; iOS Safari has no manual AE.
  // --- S14R-0001 exposure levers (round-1: ON planes clip at 255, so only
  //     exposure-down widens modulation depth on bright walls) ---
  cwcPoi: 1,           // 1 = tap on the camera view sets pointsOfInterest
                       // (AE/AFF meter there; iOS HONOURS POI, unlike evBias).
                       // The chosen POI is re-applied at each burst start.
  cwcPoiX: 0.5,        // fallback normalized POI (CFG-settable; 0..1, view fx)
  cwcPoiY: 0.5,        // fallback normalized POI (0..1, view fy)
};
// sticky bench settings across reloads of the SAME build. A new BUILD
// starts at the shipped defaults — r4's phone kept margin 25 after 1911
// shipped 10, and the count gap was that, not the decoder.
try {
  if (localStorage.getItem('s14cfgBuild') === BUILD) {
    const saved = JSON.parse(localStorage.getItem('s14cfg') || '{}');
    for (const key of Object.keys(saved)) if (key in CFG) CFG[key] = saved[key];
  } else {
    localStorage.setItem('s14cfgBuild', BUILD);
    localStorage.removeItem('s14cfg');
  }
} catch (e) {}
window._saveCfg = () => { try { localStorage.setItem('s14cfgBuild', BUILD); localStorage.setItem('s14cfg', JSON.stringify(CFG)); } catch (e) {} };
// S13 defaults REMOVED with the S1-S13 survey (27 Sep): the CWC burst needs
// only the keys above + mergeR (detectDiffBlobs, the pile-up reader).
CFG.mergeR = 6;                 // used by detectDiffBlobs (the CWC pile-up reader)
function applyCfg(j) {
  if (!j) return;
  let o; try { o = JSON.parse(j); } catch (e) { log('E cfgparse'); return; }
  const touched = [];
  for (const k in o) if (k in CFG && typeof o[k] === 'number' && isFinite(o[k])) {
    CFG[k] = o[k]; touched.push(k + '=' + o[k]);
  }
  // S14P-1923: the rig keys are NOT page-CFG entries — the box owns them and
  // hello carries them, but a mid-session CFG must retarget the rig WITHOUT a
  // reconnect (the console re-CFGs between bursts). Apply + clamp here too.
  if (typeof o.nStr === 'number' && isFinite(o.nStr)) {
    const v = Math.max(1, Math.min(8, o.nStr | 0));
    if (v !== window._nStr) { window._nStr = v; touched.push('nStr=' + v); }
    drawStrRow();      // S14R-0001: the string-count row mirrors the box shape
  }
  if (typeof o.nPerStr === 'number' && isFinite(o.nPerStr)) {
    const v = Math.max(1, Math.min(200, o.nPerStr | 0));
    if (v !== window._nPerStr) { window._nPerStr = v; touched.push('nPerStr=' + v); }
  }
  // S14P-1926: make hello/CFG-replay CONVERGENCE visible — when the rig
  // shape arrives (from hello or a replayed cfg) with the live rig already
  // equal, log the converged shape; when it CHANGES, the ordinary cfg line
  // carries nStr=/nPerStr=. Either way drift between the page and the box
  // is never silent again. Also snapshot the box's delivered rig shape for
  // the burst-start guard (after the clamps above, so _cfgRig == what the
  // box queued). The rig-key case must fire even when OTHER cfg keys were
  // touched: a replayed cfg always carries the console keys too.
  if (typeof o.nStr === 'number' || typeof o.nPerStr === 'number') {
    const rigTouched = touched.some(t => t.startsWith('nStr=') || t.startsWith('nPerStr='));
    if (!rigTouched)
      log('cfg: rig ' + window._nStr + 'x' + window._nPerStr + ' from box');
    window._cfgRig = { nStr: window._nStr | 0, nPerStr: window._nPerStr | 0 };
  }
  if (touched.length) { log('cfg ' + touched.join(',')); showCfg(); }
}
function showCfg() { $('cfgline').textContent =
  'cfg: allB=' + CFG.allB + ' evBias=' + CFG.evBias +
  ' mergeR=' + CFG.mergeR +
  ' bComp=' + CFG.bComp + ' cwc=' + CFG.cwc + ' cwcN=' + CFG.cwcN + ' cwcSettle=' + CFG.cwcSettle +
  ' amp=' + CFG.cwcAmpGate + ' margin=' + CFG.cwcMarginGate +
  ' cwcTestMode=' + CFG.cwcTestMode + ' cwcTestLed=' + CFG.cwcTestLed; }

// S14P-1923 multi-string rig (plan §6): hello carries the box's nStr/nPerStr;
// global LED id j => string j/nPerStr, pixel j%nPerStr. Decode/burst paths read
// these live (the console can re-CFG per burst) — no cached copies.
function rigCap() { return (window._nStr | 0) * (window._nPerStr | 0); }   // rig LED capacity
function paintCap() {                       // LED ids this burst maps to codes
  const rc = rigCap();
  return rc > 0 ? Math.min(rigCap(), CFG.cwcN | 0 || 200) : (CFG.cwcN | 0 || 200);
}

// ---------------- log ring (page-side only; download button) ---------------
const LOG_MAX_LINES = 400;
const logRing = [];
const t0 = Date.now();   // one wall-clock origin for every timestamp (page run)
function log(s) {
  const dt = (Date.now() - t0) / 1000;
  const line = 't' + dt.toFixed(1).padStart(6) + ' ' + s;
  logRing.push(line);
  if (logRing.length > LOG_MAX_LINES) logRing.shift();
  const el = $('log');
  el.textContent = logRing.join('\n');
  el.scrollTop = el.scrollHeight;
}
function downloadLog() {
  const blob = new Blob([logRing.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'survey_log_' + BUILD + '_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.txt';
  a.click();
  log('log downloaded (' + logRing.length + ' lines)');
}

// ---------------- WS: auto-connect, id-matched acks ------------------------
let ws = null, wsOpen = false, cmdId = 0;
const pending = new Map();      // id -> {resolve, reject, timer}
let ackRetries = 0;             // consecutive ack retries -> session recycle
// S14P-1926: a reload keeps navigator state but the fresh context reassigns
// window._ws; a live socket from the PREVIOUS context (its own auto-reconnect
// re-opened just before unload) must never suppress this context's hello —
// tonight the page sat 'open' with the box holding 8x200 while _nStr stayed 1.
// Track hello ownership per context: dedupe + stamp.
window._helloAt = 0;
function connectWS() {
  const url = 'wss://' + location.host + '/ws';
  log('ws connect ' + url);
  try { window._ws = new WebSocket(url); } catch (e) { log('E wsopen ' + e); scheduleReconnect(); return; }
  const ws = window._ws;
  ws.onopen = () => { wsOpen = true; $('wsst').textContent = 'WS: open'; $('wsst').className = 'st ok';
    sendCmd({ cmd: 'hello', build: BUILD }); };
  ws.onclose = () => { wsOpen = false; $('wsst').textContent = 'WS: closed'; $('wsst').className = 'st bad';
    for (const [id, p] of pending) { clearTimeout(p.timer); p.reject(new Error('ws closed')); }
    pending.clear(); scheduleReconnect(); };
  ws.onerror = () => { /* onclose follows */ };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.px !== undefined && m.fw === 'poc_survey') {          // hello reply:
      // S14P-1926: apply a hello shape AT MOST ONCE per context. _nStr/_nPerStr
      // are module lets reset on every context entry; the module-level guard
      // fired once for the OLD context and then blocked every fresh hello for
      // the NEW one — tonight the reloaded page kept hello-default rig 1x200
      // (window._nStr stale from the pre-reload context) all the way to 10:02.
      if (!connectWS._helloDone) {
        connectWS._helloDone = true;
        window._helloAt = Date.now();
        window._npx = m.px;                                       // string length
        window._nStr = Math.max(1, Math.min(8, m.nStr | 0 || 1));    // rig strings (S14P-1923)
        window._nPerStr = Math.max(1, Math.min(200, m.nPerStr | 0 || 200));  // per-string length
        const inp = $('npxin');
        if (!inp.dataset.user) inp.value = m.nPerStr | 0 || m.px;   // box default,
        log('box hello fw=' + m.fw + ' px=' + m.px + ' nStr=' + window._nStr + ' nPerStr=' + window._nPerStr);
        setButtons();
      } else log('hello (dedup): rig ' + (m.nStr | 0 || 1) + 'x' + (m.nPerStr | 0 || 200) +
                 ' left as ' + window._nStr + 'x' + window._nPerStr);
    }
    if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id); clearTimeout(p.timer);
      ackRetries = 0;
      if (m.ok) p.resolve(m); else p.reject(new Error(m.err || 'nack'));
    }
  };
}
let reconnectAt = 0;
let lastAckRetryLog = 0;
function scheduleReconnect() {
  const wait = Math.min(5000, 500 * Math.pow(2, reconnectAt++));
  log('ws retry in ' + wait + 'ms');
  setTimeout(() => { if (!wsOpen) connectWS(); }, wait);
}
// ack-retry pile-up = the degraded-session signature (25 s -> 2 min surveys).
// After 8 retries in a short window, recycle the WHOLE page: fresh TLS, fresh
// camera, fresh AE — the proven bench reset. One line in the log explains why.
setInterval(() => {
  if (ackRetries >= 8 && !scanning) {
    log('session degraded (' + ackRetries + ' ack retries) — auto-reload');
    sessionStorage.setItem('autoRecycle', '1');
    location.reload();
  }
}, 10000);
function sendCmd(obj, opt) {
  return new Promise((resolve, reject) => {
    if (!wsOpen || !window._ws || window._ws.readyState !== 1) { reject(new Error('ws down')); return; }
    const id = ++cmdId;
    obj.id = id;
    const o = opt || {};
    const tries = o.tries || 2;              // frame paints are idempotent
    const attempt = (left) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        if (left > 0) { log('ack retry id' + id); ackRetries++; attempt(left - 1); }
        else reject(new Error('ack timeout ' + obj.cmd));
      }, o.timeout || 2500);
      pending.set(id, { resolve, reject, timer });
      window._ws.send(JSON.stringify(obj));
    };
    attempt(tries);
  });
}

// ---------------- camera: robust auto-start, single rVFC pump -------------
let stream = null, videoTrack = null, camReady = false, frameIdx = 0;
// Processing dimensions come from the TRACK's real aspect (portrait phone
// cameras report 720x1280-class sizes). Long side capped at 720 for CPU;
// short side scales to match, so nothing is ever squashed.
let W = 640, H = 360;
// CANVAS OWNERSHIP (bug class of S14P-1900/1903 — keep this rule intact:
//   procCx owns GRABS: every capture path reads procCx, only grab() draws it.
//   camCx owns DISPLAY: idle preview + overlays only.
// Never snapshot the display canvas — the idle redraw between grabs ships
// overlay pixels instead of the frame (the S14P-1903 test-mode bug).
const camCv = $('cam'), camCx = camCv.getContext('2d', { willReadFrequently: true });
const procCv = document.createElement('canvas');
const procCx = procCv.getContext('2d', { willReadFrequently: true });
function sizeForVideo(vw, vh) {
  if (!vw || !vh) return;
  const scale = Math.min(1, 720 / Math.max(vw, vh));
  W = Math.max(2, Math.round(vw * scale / 2) * 2);
  H = Math.max(2, Math.round(vh * scale / 2) * 2);
  procCv.width = W; procCv.height = H;
  log('proc ' + W + 'x' + H + ' (video ' + vw + 'x' + vh + ')');
}
let grabResolvers = [];            // rVFC-based grabs (single pump owns rVFC)

function startCamera() {
  $('camst').textContent = 'Cam: requesting';
  const p = navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false });
  Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('gum 12s timeout')), 12000))])
    .then((s) => {
      stream = s;
      videoTrack = s.getVideoTracks()[0];
      const v = $('vid');
      v.srcObject = s;
      $('camst').textContent = 'Cam: playing';
      return v.play();
    })
    .then(() => {
      const vv = $('vid');
      const vw = vv.videoWidth, vh = vv.videoHeight;
      log('cam live ' + vw + 'x' + vh + ' track=' + (videoTrack && videoTrack.label || '?'));
      sizeForVideo(vw, vh);
      camCv.width = W; camCv.height = H;   // display = processing aspect, no squash
      camReady = true; frameIdx = 0;
      $('camst').textContent = 'Cam: live'; $('camst').className = 'st ok';
      applyEvBias(); _evLastApplied =
        (typeof CFG.evBias === 'number' && isFinite(CFG.evBias)) ? CFG.evBias : -1;
      pump();
    })
    .catch((e) => {
      log('E cam ' + (e && e.name || e));
      $('camst').textContent = 'Cam: retrying'; $('camst').className = 'st bad';
      const t = setTimeout(startCamera, 8000);          // retry with a timer
      const kick = () => { clearTimeout(t); document.removeEventListener('visibilitychange', kick);
                           camCv.removeEventListener('touchstart', kick); startCamera(); };
      document.addEventListener('visibilitychange', kick);
      camCv.addEventListener('touchstart', kick);       // retry on any touch (gesture)
    });
}
function applyEvBias() {
  try {
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (caps && caps.exposureCompensation) {
      const target = Math.max(caps.exposureCompensation.min || -3, Math.min(CFG.evBias, caps.exposureCompensation.max || 3));
      videoTrack.applyConstraints({ advanced: [{ exposureCompensation: target }] })
        .then(() => log('ev bias ' + target)).catch((e) => log('ev bias failed'));
    } else log('ev: not exposed (iOS expected)');
  } catch (e) { log('ev probe failed'); }
}
// S14R-0001 exposure fixes (round-1: 191/277 misses were amp<40 WITH healthy
// codeword evidence — ON planes clip at 255 so only exposure-down widens the
// modulation depth; iOS ignores exposureCompensation but HONOURS
// pointsOfInterest).
// applyEvBiasAtBurst: re-apply the CFG evBias AT BURST START when it CHANGED
// since the camera-ready application (it previously ran exactly once at
// camera-ready, so a mid-session CFG evBias never took effect).
let _evLastApplied = null;
function applyEvBiasAtBurst() {
  const v = (typeof CFG.evBias === 'number' && isFinite(CFG.evBias)) ? CFG.evBias : -1;
  if (v === _evLastApplied) return;          // unchanged -> no constraint spam
  _evLastApplied = v;
  if (videoTrack) applyEvBias();
}
async function applyPoi() {
  // Aim AE/AFF at the operator-chosen point. iOS Safari honours
  // pointsOfInterest (unlike evBias); Android Chrome accepts it too.
  if (!videoTrack) return false;
  try {
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (!caps || !caps.pointsOfInterest) return false;
    const fx = Math.max(0, Math.min(1, CFG.cwcPoiX || 0.5));
    const fy = Math.max(0, Math.min(1, CFG.cwcPoiY || 0.5));
    await videoTrack.applyConstraints({ advanced: [{ pointsOfInterest: { x: fx, y: fy } }] });

// per-frame compact metrics: peak/median/d90 of luma, clip fractions, blobs
function frameMetrics(d) {     // d = ImageData
  const px = d.data, n = W * H;
  let pk = 0, med = 0, d90 = 0, clipW = 0, clipC = 0, satHi = 0;
  const hist = new Uint32Array(16);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = px[p], g = px[p + 1], b = px[p + 2];
    const luma = r > g ? (r > b ? r : b) : (g > b ? g : b);   // max(r,g,b)
    if (luma > pk) pk = luma;
    hist[luma >> 4]++;
    const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
    const sat = luma - mn;
    if (mn >= 250) clipW++;                                    // white-clipped
    else if (luma >= 250) clipC++;                             // single-channel clip
    if (sat >= 80) satHi++;
  }
  // median + d90 from histogram (q50 -> med, q90 -> d90)
  let acc = 0; const q50 = n >> 1, q90 = (n * 9) >> 4;
  for (let i = 0; i < 16; i++) {
    acc += hist[i];
    if (acc >= q50 && med === 0) med = (i << 4) + 8;
    if (acc >= q90) { d90 = (i << 4) + 8; break; }
  }
  return { pk, med, d90, clipW, clipC, satHi, n };
}

// chan: Float32Array (W*H) with the detection channel value per pixel.

// difference-blob detection: signed difference array (accent - all-on),
// absolute threshold, flood fill, dominance vs outside positive tail.
// Bench-proven (offline_diff2.py, Sep 22): static scene cancels; the die is
// the only residual (green: pk130 n77, margin 1.9 at thr40).
function detectDiffBlobs(diffArr, thr, domK, mergeR) {
  const n = W * H;
  const seen = new Uint8Array(n);
  const stack = new Int32Array(n);
  const blobs = [];
  for (let s0 = 0; s0 < n; s0++) {
    if (seen[s0] || diffArr[s0] < thr) continue;
    let sp = 0; stack[sp++] = s0; seen[s0] = 1;
    let cnt = 0, sx = 0, sy = 0, peak = 0, sw = 0, wx = 0, wy = 0;
    while (sp > 0) {
      const idx = stack[--sp];
      cnt++;
      const x = idx % W, y = (idx / W) | 0;
      sx += x; sy += y;
      const v = diffArr[idx];
      if (v > peak) peak = v;
      // LUMA-WEIGHTED CENTROID (S13F): weight each pixel by its depth above
      // threshold, pulling the position to the hole's darkest point instead
      // of the geometric middle of the bloom's skirts.
      const wgt = v - thr;
      sw += wgt; wx += x * wgt; wy += y * wgt;
      if (x > 0 && !seen[idx - 1] && diffArr[idx - 1] >= thr) { seen[idx - 1] = 1; stack[sp++] = idx - 1; }
      if (x < W - 1 && !seen[idx + 1] && diffArr[idx + 1] >= thr) { seen[idx + 1] = 1; stack[sp++] = idx + 1; }
      if (y > 0 && !seen[idx - W] && diffArr[idx - W] >= thr) { seen[idx - W] = 1; stack[sp++] = idx - W; }
      if (y < H - 1 && !seen[idx + W] && diffArr[idx + W] >= thr) { seen[idx + W] = 1; stack[sp++] = idx + W; }
    }
    if (cnt >= 2) blobs.push({ cnt, cx: sx / cnt, cy: sy / cnt,
      wcx: sw > 0 ? wx / sw : sx / cnt, wcy: sw > 0 ? wy / sw : sy / cnt, peak });
  }
  blobs.sort((a, b) => b.peak - a.peak);
  // BLOOM MERGE (S11): a clipped die fragments into peak + halo blobs
  // (bench: G p60n10 + p48n6 3 px apart). Merge blobs whose centroids are
  // within mergeR x the larger blob's radius. Repeat until stable.
  if (mergeR) {
    let merged = true;
    while (merged && blobs.length > 1) {
      merged = false;
      outer:
      for (let i = 0; i < blobs.length; i++) {
        for (let j = i + 1; j < blobs.length; j++) {
          const a2 = blobs[i], b2 = blobs[j];
          const ra = Math.sqrt(a2.cnt / Math.PI), rb = Math.sqrt(b2.cnt / Math.PI);
          const dist = Math.hypot(a2.cx - b2.cx, a2.cy - b2.cy);
          if (dist < mergeR * Math.max(ra, rb)) {
            const nA = a2.cnt, nB = b2.cnt;
            a2.cx = (a2.cx * nA + b2.cx * nB) / (nA + nB);
            a2.cy = (a2.cy * nA + b2.cy * nB) / (nA + nB);
            a2.cnt = nA + nB;
            a2.peak = Math.max(a2.peak, b2.peak);
            blobs.splice(j, 1);
            merged = true;
            break outer;
          }
        }
      }
    }
  }
  const tail = [];
  const inB = seen;
  for (let i = 0; i < n; i += 2) if (!inB[i] && diffArr[i] > 0) tail.push(diffArr[i]);
  tail.sort((a, b) => b - a);
  const k = Math.max(1, Math.floor(tail.length / 10));
  let d10out = 0;
  for (let i = 0; i < k; i++) d10out += tail[i];
  d10out /= k;
  const accepted = [];
  for (const b of blobs) {
    if (b.peak >= domK * Math.max(1, d10out)) { b.d10out = d10out; accepted.push(b); }
    else break;
  }
  return { blobs, accepted, thr, d10out };
}

async function paint(cmdObj) { await sendCmd(cmdObj, { tries: 2, timeout: 2500 }); }

// S14P-1923 (plan §6/§8): CWC paints ride ONE binary WS message per plane.
// S14R-0000: the 12-of-24 Golay bank has 24 planes -> a 240-byte bit-plane
// makes the message exactly 246 B. Shape (exact 246 B): [0]='B' [1]=ver=1
// [2]=b [3]=flags=0 [4..5]=u16 LE epoch [6..245]=bit-plane, 1920 bits,
// bit j = global LED id j (LSB-first
// per byte: (data[6+(j>>3)]>>(j&7))&1). Bit set = white at b, clear = black.
// The box acks via the normal latch path carrying this epoch — sendCmd's
// id-matched ack map resolves it exactly like a JSON cmd ack.
function frameBitsPaint(bitsOrNull, b, epoch) {
  return new Promise((resolve, reject) => {
    if (!wsOpen || !window._ws || window._ws.readyState !== 1) { reject(new Error('ws down')); return; }
    const msg = new Uint8Array(246);
    msg[0] = 0x42;                          // 'B'
    msg[1] = 1;                             // ver
    msg[2] = b & 255;                       // brightness
    msg[3] = 0;                             // flags
    msg[4] = epoch & 255; msg[5] = (epoch >> 8) & 255;   // u16 LE epoch
    if (bitsOrNull) msg.set(bitsOrNull, 6); // 240 B payload (was 200 B in the 18-plane era)
    const id = epoch;                       // ack matcher key
    const timer = setTimeout(() => { pending.delete(id); reject(new Error('ack timeout frame-bits')); }, 2500);
    pending.set(id, { resolve, reject, timer });
    window._ws.send(msg);
  });
}

// phase correlation in-page: NCC on a 128-wide decimated grid
// v2 (actual): downsample both to 256x144, FFT via cv-style naive 2D DFT on
// the SMALL grid is still heavy in pure JS... pragmatic: use spatial-domain
// normalised cross-correlation on a coarse grid via direct convolution at
// 128x72 decimated resolution — good to ±1 px, cheap, and the remainder is
// measured CONSOLE-side in analyse (which stays the ground truth).
function phaseCorrJS(refLuma, curLuma) {
  const DW = 128, DH = Math.round(128 * H / W / 2) * 2 || 72;
  const a = new Float32Array(DW * DH), b = new Float32Array(DW * DH);
  for (let y = 0; y < DH; y++) {
    const sy = Math.min(H - 1, Math.round(y * H / DH));
    for (let x = 0; x < DW; x++) {
      const sx = Math.min(W - 1, Math.round(x * W / DW));
      a[y * DW + x] = refLuma[sy * W + sx];
      b[y * DW + x] = curLuma[sy * W + sx];
    }
  }
  // normalised cross-correlation over ±12 px search, 1 px steps
  let best = -1e9, bdx = 0, bdy = 0;
  const mean = (arr) => { let s = 0; for (let i = 0; i < arr.length; i++) s += arr[i]; return s / arr.length; };
  const ma = mean(a);
  const aC = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) aC[i] = a[i] - ma;
  let a2 = 0; for (let i = 0; i < aC.length; i++) a2 += aC[i] * aC[i];
  a2 = Math.sqrt(a2);
  const mb = mean(b);
  const bC = new Float32Array(b.length);
  for (let i = 0; i < b.length; i++) bC[i] = b[i] - mb;
  for (let dy = -12; dy <= 12; dy++) {
    for (let dx = -12; dx <= 12; dx++) {
      let s = 0, b2 = 0;
      for (let y = 0; y < DH; y++) {
        const sy = y + dy;
        if (sy < 0 || sy >= DH) continue;
        for (let x = 0; x < DW; x++) {
          const sx = x + dx;
          if (sx < 0 || sx >= DW) continue;
          const v = bC[sy * DW + sx];
          s += aC[y * DW + x] * v;
          b2 += v * v;
        }
      }
      b2 = Math.sqrt(b2);
      const ncc = (a2 * b2) > 0 ? s / (a2 * b2) : 0;
      if (ncc > best) { best = ncc; bdx = dx; bdy = dy; }
    }
  }
  // Return the MEASURED MOTION of cur relative to ref: (bdx, bdy) is where
  // cur must be sampled from to align with ref (verified in numpy: content
  // moved (+10,+5) => best (+10,+5) => corrected[y] = cur[y+10] = ref[y]).
  // The warp in benchCaptureComp consumes exactly this sign.
  return { dx: bdx, dy: bdy, conf: Math.max(0, best) };
}
// corrected capture: warp the ORIGINAL camera pixels back by -(tot) using
// bilinear sampling from procCx's current ImageData
function benchCaptureComp(label, tot) {
  try {
    const d = procCx.getImageData(0, 0, W, H);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cx = c.getContext('2d');
    // warp: build corrected ImageData by bilinear sampling at (x+dx, y+dy)
    const out = cx.createImageData(W, H);
    const dx = tot.dx, dy = tot.dy;
    for (let y = 0; y < H; y++) {
      const fy = y + dy;
      const y0 = Math.floor(fy), ty = fy - y0;
      const y0c = Math.max(0, Math.min(H - 1, y0));
      const y1c = Math.max(0, Math.min(H - 1, y0 + 1));
      for (let x = 0; x < W; x++) {
        const fx = x + dx;
        const x0 = Math.floor(fx), tx = fx - x0;
        const x0c = Math.max(0, Math.min(W - 1, x0));
        const x1c = Math.max(0, Math.min(W - 1, x0 + 1));
        const o = (y * W + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          const v00 = d.data[(y0c * W + x0c) * 4 + ch];
          const v10 = d.data[(y0c * W + x1c) * 4 + ch];
          const v01 = d.data[(y1c * W + x0c) * 4 + ch];
          const v11 = d.data[(y1c * W + x1c) * 4 + ch];
          out.data[o + ch] = v00 * (1 - tx) * (1 - ty) + v10 * tx * (1 - ty) +
                             v01 * (1 - tx) * ty + v11 * tx * ty;
        }
        out.data[o + 3] = 255;
      }
    }
    cx.putImageData(out, 0, 0);
    const jpg = c.toDataURL('image/jpeg', 0.5).split(',')[1];
    benchStore.push({ t: ((Date.now() - t0) / 1000).toFixed(3), label, W, H,
                      exp: expLine() + ' comp=' + tot.dx.toFixed(2) + ',' + tot.dy.toFixed(2) + '@' + tot.conf.toFixed(2), jpg });
    if (benchStore.length > benchMax) {
      // S14P-1928: same wrap rule as benchCapture (comp path) — the oldest
      // slot is dropped; log which label was lost.
      const lost = benchStore[0].label;
      benchStore.shift();
      log('E store FULL — send now (oldest wrapping): lost ' + lost);
    }
  } catch (e) { log('E benchcapcomp ' + (e && e.message || e)); }
}

    // but the decode/registration stack (cwcChain/guard/cwcDecode/
    // cwcShowResults/cwcStats/CWCDEC) is skipped — the console re-registers
    // and decodes offline from the raw frames — and the end-of-run auto-ship
    // is skipped: frames ACCUMULATE in benchStore across bursts and leave via
    // 'Send frames (all)' (btnSendFrames) or a directive BRAMP.
    const capOnly = $('chkCapOnly') && $('chkCapOnly').checked;
    const n = Math.max(2, Math.min(40, CFG.bBurstN | 0 || 20));
    const gap = Math.max(0, CFG.bBurstGap | 0);
    const hold = Math.max(0, CFG.bBurstHold | 0);
    const b = Math.max(20, Math.min(255, CFG.bBurstB | 0 || 150));
    benchStats = null; window._driftTrail = null;
    cwcStats = null;                       // S14J: stale CWC stats never ship
    // S14P-1902 (operator request): runs ship ONCE — clear the ring at the
    // START of each burst. The previous design kept every run since the page
    // loaded, so re-pulls re-shipped old frames (the pile-up) and the heap
    // never shrank. A failed/missed pull is still recoverable: the store
    // keeps its frames until the NEXT burst starts (BRAMP any time before
    // then; LOGA keeps the arm open so nothing is lost to a closed window).
    // S14P-1928: capture-only mode is the ACCUMULATING exception — frames
    // stay across bursts, ship via the manual 'Send frames (all)' button.
    if (benchStore.length && !capOnly) {
      log('bench store cleared: ' + benchStore.length + ' unshipped or unpulled frames dropped');
      benchStore.length = 0;
    }
    abortFlag = false;                     // an aborted survey must not abort the next burst
    benchRunNo++;                          // run tag for the accumulating ring
    const cwcMode = (CFG.cwc | 0) === 1;   // CWC branch paints its own all-on
    if (!cwcMode) {
      log('burst: all-on ' + b + ' hold ' + hold + 'ms');
      await paint({ cmd: 'all', b });
      const tHold0 = Date.now();
      while (Date.now() - tHold0 < hold) await sleep(20);   // AE settle
    }
    const gts = [];
    // ---- drift compensation (S14A2, Oliver's seeded scheme) -------------
    // After each grab, estimate the frame's motion vs the MASTER frame and
    // CORRECT the stored pixels: warpAffine by the seeded transform, so the
    // stored frames are already registered to master. Console-side analyse
    // then sees ~0 shift on a still rig, and the residual stats measure the
    // compensation quality directly. Seed = last composed T (no prediction).
    // Also ship the measured (dx, dy) per frame in the FRAME meta + BSTATS.
    // (S14P-1904: the comp master is born where the burst's master is —
    // comp mode no longer grabs a separate black all-on at burst start.)
    window._saveCfg && window._saveCfg();   // persist bench CFG
    const comp = CFG.bComp | 0;
    // S14R-0001: exposure levers take effect at every burst start —
    // applyEvBias once ran only at camera-ready, so a mid-session CFG
    // evBias never reached the camera (round-1 finding). Re-applied here
    // only when the CFG value changed; POI (the iOS-honoured lever) is
    // re-asserted every burst.
    applyEvBiasAtBurst();
    applyPoi();
    // S14J CWC form: holeGap floor lesson (<70 ms paint->grab lands inside
    // the camera pipeline floor) — clamp the plane settle, never skip it.
    const settleClamp = (ms) => Math.max(70, ms | 0 || 70);
    let masterLuma = null;
    const bShifts = [];
    let lastLuma = null;               // comp=0 path: previous frame luma
    // ---- S14P-1916 CWC-form burst (primer P00..P17 + fast master) ---------
    // P00 is painted for 1 s so AE settles, then P00..P17 are grabbed, then a
    // fast all-on master grab before the meter can re-adjust (the 1915 lesson:
    // locking AE to manual with a frozen exposureCompensation is safe; the 1914
    // bug froze it to the half-on P00 plane, which was dark). If AE lock is
    // supported it is applied after P00 is grabbed and before P01..P17.
    // S14P-1911: REGISTRATION IS DIRECT PER-PLANE (cwcChain: each plane NCCs
    // vs the master independently — the 1904 backwards-accumulation chain is
    // retired; its accumulated totals carried a 1-2.3 px bias).
    if (cwcMode && (!window.CWC_CODES_12OF24 || !window.CWC_CODES_12OF24.length)) {
      log('E cwc: codeword bank missing');
    } else if (cwcMode) {
      const testMode = (CFG.cwcTestMode | 0) === 1;
      // S14P-1926 rig-mismatch guard: a burst must not silently paint the
      // hello-default shape when the box holds a queued/other rig config.
      // window._cfgRig = the rig shape the box's cfg channel last delivered
      // (what the box's hello would answer after a reconnect) — if the live
      // _nStr/_nPerStr drifted from it, flag it LOUD but do NOT refuse the
      // burst (operator choice; a reconnect now converges via the replay).
      if (window._cfgRig &&
          ((window._cfgRig.nStr | 0) !== (window._nStr | 0) ||
           (window._cfgRig.nPerStr | 0) !== (window._nPerStr | 0)))
        log('E rig mismatch: page ' + (window._nStr | 0) + 'x' + (window._nPerStr | 0) +
            ' vs box ' + (window._cfgRig.nStr | 0) + 'x' + (window._cfgRig.nPerStr | 0) +
            ' — reconnect/CFG');
      const nL = Math.max(10, Math.min(paintCap(), CFG.cwcN | 0 || 150));
      // per-STRING polyfuse budget (the 2 A-hold rule, page-side mirror of
      // the firmware's applyBits per-string clamp — S14P-1924 fix: the
      // 255000/(px*14.2) form was 2x conservative (forgot the 15.1 mW/px
      // to full-scale duty division); identical math to the firmware:
      // floor(510 / (nPerStr * 0.0142)) = full-scale px / 15.1 mW * 2 A.
      // At nPerStr=200 -> 179, so the standing bBurstB=150 passes
      // unclamped (1923 wrongly clamped it to 89).
      const maxB = Math.min(255, Math.floor(510 / (Math.max(1, window._nPerStr) * 0.0142)));
      const cb = Math.max(20, Math.min(maxB, CFG.bBurstB | 0 || 150));
      const testLed = Math.max(0, Math.min(nL - 1, CFG.cwcTestLed | 0 || 0));
      // S14R-0000 burst log: same paint/grab/settle choreography, 24 planes;
      // capture mode stays prefixed 'cwc capture:' so runs are distinguishable.
      log((testMode ? 'cwc test: ' : (capOnly ? 'cwc capture: ' : 'cwc burst: ')) +
          'primer(1s) -> 24 frame-bits planes -> master(fast), ' + nL +
          ' leds (rig ' + rigCap() + '), b=' + cb + (cb < (CFG.bBurstB | 0 || 150) ? ' (clamped)' : '') +
          (testMode ? ', led=' + testLed : ''));
      const grabPlane = () => grabTimeout().then(() => lumaOf(procCx.getImageData(0, 0, W, H)));
      const planes = [];
      for (let p = 0; p < 24; p++) {
        if (abortFlag) break;
        await frameBitsPaint(cwcPlanePaint(p, nL, cb), cb, ++cmdId);   // ONE binary WS message per plane
        const settle = p === 0 ? 1000 : settleClamp(CFG.cwcSettle);
        const tS = Date.now();
        while (Date.now() - tS < settle) await sleep(10);
        planes.push(await grabPlane());
        if (p === 0 && CFG.cwcAeLock) await lockAeAfterP00();
        benchCapture('cwc:r' + benchRunNo + ':p' + String(p).padStart(2, '0'));
        gts.push(Date.now());
      }
      // MASTER: fast all-on grab before the AE meter re-adjusts.
      await paint({ cmd: 'all', b: cb });
      await sleep(70);  // just enough pipeline flush; keep it fast
      const cwcMst = await grabPlane();
      benchCapture('cwc:r' + benchRunNo + ':master');
      gts.push(Date.now());
      // S14P-1928 CAPTURE-ONLY branch: the 19 frames are in benchStore —
      // STOP here. No registration chain, no health guard, no in-page
      // decode, no result view, no CWCDEC/CWCDECS ship, no cwcStats (the
      // console re-registers + decodes offline from the raw frames); the
      // shared auto-ship below is skipped for capOnly (accumulating store).
      if (capOnly) {
        log('captured: r' + benchRunNo + ' 25 frames (store ' + benchStore.length + '/' + benchMax + ')' +
            (benchStore.length >= benchMax ? ' — FULL' : ''));
        await paint({ cmd: 'black' });
      } else {
      // 1911: direct per-plane registration + in-page position decode +
      // result view
      const chain = cwcChain(cwcMst, planes);
      log('chain totals (source px): ' + chain.map((s, p) =>
        'p' + p + '(' + s.dx.toFixed(1) + ',' + s.dy.toFixed(1) + '@' + s.conf.toFixed(2) + ')').join(' '));
      // health guard (1909/1915): any plane outside the residual budget warps
      // registration and the decode degrades. Flag low confidence, absolute
      // offset beyond the recoverable budget, or a sudden step between planes.
      let badConf = 0, badRem = 0, badStep = 0;
      const flagged = [];
      let prev = null;
      chain.forEach((s, p) => {
        const rem = Math.hypot(s.dx, s.dy);
        if (s.conf < CFG.cwcGuardConf) { badConf++; flagged.push('p' + p + ' conf ' + s.conf.toFixed(2)); }
        else if (rem > CFG.cwcGuardRem) { badRem++; flagged.push('p' + p + ' rem ' + rem.toFixed(1)); }
        else if (prev) {
          const step = Math.hypot(s.dx - prev.dx, s.dy - prev.dy);
          if (step > CFG.cwcGuardStep) { badStep++; flagged.push('p' + p + ' step ' + step.toFixed(1)); }
        }
        prev = s;
      });
      if (badConf || badRem || badStep)
        log('E MOTION WARNING: chain degraded outside budget — conf<'
            + CFG.cwcGuardConf + ' on ' + badConf + ' plane(s), offset>'
            + CFG.cwcGuardRem + 'px on ' + badRem + ' plane(s), step>'
            + CFG.cwcGuardStep + 'px on ' + badStep + ' plane(s): ' + flagged.join(' '));
      const dec = cwcDecode(cwcMst, planes, chain, nL);
      log('decode: ' + dec.nSites + ' px masked, ' + dec.sites.length + ' sites confirmed' +
          ' (amp>=' + CFG.cwcAmpGate + ', margin>=' + CFG.cwcMarginGate +
          ', rig ' + window._nStr + 'x' + window._nPerStr + ')');
      cwcShowResults(cwcMst, dec, testMode ? 'test led ' + testLed : 'cwc burst'
          + ((badConf || badRem || badStep) ? ' — MOTION FLAGGED, unreliable' : ''));
      if (testMode) log('test LED ' + testLed + ' codeword bits: ' + cwcBits(testLed, nL).join(','));
      cwcStats = { build: BUILD, n: planes.length, comp: 0,
                   testMode: testMode ? 1 : 0, testLed,
                   testBits: testMode ? cwcBits(testLed, nL) : undefined,
                   nStr: window._nStr, nPerStr: window._nPerStr,   // S14P-1923: rig shape rides the stats line
                   chain: chain.map((s, k) => ({ k, dx: +s.dx.toFixed(2), dy: +s.dy.toFixed(2), conf: +s.conf.toFixed(3) })),
                   decode: { ampGate: CFG.cwcAmpGate, marginGate: CFG.cwcMarginGate, suppress: CFG.cwcSuppress,
                             sitesMasked: dec.nSites, confirmed: dec.sites.length, conflicts: dec.conflicts.length,
                             k: dec.k.map((v) => +v.toFixed(3)) },
                   conflicts: dec.conflicts };
      // NOTE: sites do NOT ride in cwcStats — the full stats line must stay
      // under the box's 4096 B WS message cap; sites ship via shipCwcDec's
      // chunked CWCDEC lines (console reassembles -> <run>/cwc_dec.json).
      // 1912: drift trail = successive differences of the absolute offsets.
      // Summing the offsets themselves drew a false lurch (r4 Σdx −146).
      const pairs = [];
      let netX = 0, netY = 0, stepMax = 0;
      for (let i = 1; i < chain.length; i++) {
        const dx = chain[i].dx - chain[i - 1].dx, dy = chain[i].dy - chain[i - 1].dy;
        pairs.push({ dx: dx, dy: dy });
        netX += dx; netY += dy;
        stepMax = Math.max(stepMax, Math.hypot(dx, dy));
      }
      window._driftTrail = { pairs: pairs, scale: 6,
        text: 'cwc step ' + stepMax.toFixed(1) + ' net ' + Math.hypot(netX, netY).toFixed(1) };
      drawDriftTrail();
      await paint({ cmd: 'black' });
      // ship the full decode: sites list FIRST (CWCDEC chunks 1..N), then the
      // summary line CWCDECS (k gains + gates + counts) — reassembly joins the
      // chunk stream exactly once (S14P-1905 fix: 1904 shipped the summary
      // object as CWCDEC, so cwc_dec.json had counts but no sites).
      if (dec.sites.length) {
        const jS = JSON.stringify(dec.sites);
        for (let i = 0; i < jS.length; i += 1200) {
          await sendCmd({ cmd: 'logc', d: 'CWCDEC ' + jS.slice(i, i + 1200) }, { tries: 2, timeout: 2000 });
          await sleep(30);
        }
        await sendCmd({ cmd: 'logc', d: 'CWCDECS ' + JSON.stringify({ ampGate: CFG.cwcAmpGate, marginGate: CFG.cwcMarginGate, suppress: CFG.cwcSuppress, sitesMasked: dec.nSites, confirmed: dec.sites.length, conflicts: dec.conflicts.length, k: dec.k.map(v => +v.toFixed(3)), strings: window._nStr, perString: window._nPerStr }) }, { tries: 2, timeout: 2000 });
      }
      // NO benchPull here: the shared S14L auto-ship at benchRun's end
      // ships the store once (a local call double-shipped the 19 frames —
      // harness-verified 29 Sep).
      } // end non-capture CWC decode branch (S14P-1928: capOnly skips the
        // chain, health guard, decode, drift trail AND the CWCDEC ship —
        // they all read the decode-branch consts chain/dec)
    } else {
    // ---- original all-on movement burst (unchanged; CWCSTATS added so the
    // pull ships stats even when BSTATS loses the arm race) ----
    const loop = async () => {
      for (let k = 0; k < n; k++) {
        await grabTimeout();
        const tGrab = Date.now();
        if (comp && k > 0) {
          // luma of the just-grabbed frame (procCx holds it)
          const d = procCx.getImageData(0, 0, W, H);
          const cur = new Float32Array(W * H);
          for (let i = 0, p = 0; i < cur.length; i++, p += 4) {
            cur[i] = d.data[p] > d.data[p+1] ? (d.data[p] > d.data[p+2] ? d.data[p] : d.data[p+2])
                                             : (d.data[p+1] > d.data[p+2] ? d.data[p+1] : d.data[p+2]);
          }
          // seeded estimate: frame k vs MASTER, seeded by T_{k-1}
          const prev = bShifts[bShifts.length - 1] || { dx: 0, dy: 0 };
          const pre = new Float32Array(cur.length);
          // integer pre-shift via sampling (sub-px remainder goes to phase corr)
          const rdx = Math.round(prev.dx), rdy = Math.round(prev.dy);
          for (let y = 0; y < H; y++) {
            const sy = y + rdy;
            if (sy < 0 || sy >= H) continue;
            for (let x = 0; x < W; x++) {
              const sx = x + rdx;
              if (sx < 0 || sx >= W) continue;
              pre[y * W + x] = cur[sy * W + sx];
            }
          }
          const rem = phaseCorrJS(masterLuma, pre);   // remainder estimate
          // S14B-5 fix: the NCC estimates in DECIMATED-GRID units (DW=128
          // wide vs W source px); convert to source px before every
          // consumer. Raw-grid consumption corrected only ~1-DW/W = 31% of
          // motion (0.685x lag per frame). Gate: cwcTest() round trip.
          const K = W / 128;
          const tot = { dx: rdx + rem.dx * K, dy: rdy + rem.dy * K, conf: rem.conf };
          bShifts.push(tot);
          // CORRECT the stored frame: warp the ORIGINAL frame back by -tot
          benchCaptureComp('burst:r' + benchRunNo + ':f' + k, tot);
        } else {
          // comp=0: still MEASURE the frame-to-frame motion so the drift
          // report/trail works without correction (26 Sep gap: button
          // bursts default bComp=0 and reported 0.0 forever).
          if (k > 0) {
            const dPrev = lastLuma;                    // previous frame luma
            const d = procCx.getImageData(0, 0, W, H);
            const cur = new Float32Array(W * H);
            for (let i = 0, p = 0; i < cur.length; i++, p += 4) {
              const r = d.data[p], g = d.data[p + 1], b = d.data[p + 2];
              cur[i] = r > g ? (r > b ? r : b) : (g > b ? g : b);
            }
            const step = phaseCorrJS(dPrev, cur);      // F2F motion
            const prev = bShifts[bShifts.length - 1] || { dx: 0, dy: 0 };
            bShifts.push({ dx: prev.dx + step.dx, dy: prev.dy + step.dy,
                           conf: step.conf });
            lastLuma = cur;
          } else {
            const d = procCx.getImageData(0, 0, W, H);
            lastLuma = new Float32Array(W * H);
            for (let i = 0, p = 0; i < lastLuma.length; i++, p += 4) {
              const r = d.data[p], g = d.data[p + 1], b = d.data[p + 2];
              lastLuma[i] = r > g ? (r > b ? r : b) : (g > b ? g : b);
            }
            if (comp) masterLuma = lastLuma;   // frame 0 IS the comp master
                                               // (all-on hold guaranteed it)
            bShifts.push({ dx: 0, dy: 0, conf: 1 });
          }
          benchCapture('burst:r' + benchRunNo + ':f' + k);
        }
        gts.push(tGrab);
        if (abortFlag) break;
        // pace: wait until gap ms after the PREVIOUS grab started
        const target = gts[gts.length - 1] + gap;
        while (Date.now() < target) await sleep(5);
      }
    };
    await loop();
    const iv = [];
    for (let i = 1; i < gts.length; i++) iv.push(gts[i] - gts[i - 1]);
    iv.sort((a, b) => a - b);
    const med = iv.length ? iv[iv.length >> 1] : 0;
    const fps = med > 0 ? 1000 / med : 0;
    benchStats = { build: BUILD, n: gts.length, gap_cfg: gap,
                   med_ms: med, min_ms: iv.length ? iv[0] : 0,
                   max_ms: iv.length ? iv[iv.length - 1] : 0,
                   fps: Math.round(fps * 100) / 100,
                   comp: comp ? 1 : 0,
                   shifts: bShifts };
    log('burst stats: n=' + benchStats.n + ' med ' + med + 'ms (' + benchStats.fps +
        ' fps) min/max ' + benchStats.min_ms + '/' + benchStats.max_ms +
        (comp ? ' comp residual max ' + (bShifts.slice(1).reduce((m, s) => Math.max(m, Math.abs(s.dx) + Math.abs(s.dy)), 0)).toFixed(2) + 'px' : ''));
    // ---- drift report + segment trail (operator request, 26 Sep) ---------
    // bShifts[k] = frame k's motion vs master (comp) — for comp=0 runs the
    // increments ARE the frame-to-frame shifts (raw). Report peak & total
    // per axis; draw the shift trail as connected segments on the view.
    try {
      const pairs = [];
      for (let i = 1; i < bShifts.length; i++) {
        pairs.push({ dx: bShifts[i].dx - bShifts[i - 1].dx,
                     dy: bShifts[i].dy - bShifts[i - 1].dy,
                     conf: bShifts[i].conf });
      }
      // comp=0: bShifts are raw frame-vs-master offsets; increments = F2F.
      // comp=1: bShifts are residuals ~0; F2F shifts arrive via the seeded
      // pre-shift + remainder, so pairs above are still the right deltas.
      const xs = pairs.map(p => p.dx), ys = pairs.map(p => p.dy);
      const maxX = xs.reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0);
      const maxY = ys.reduce((a, b) => Math.abs(b) > Math.abs(a) ? b : a, 0);
      const totX = xs.reduce((a, b) => a + b, 0);
      const totY = ys.reduce((a, b) => a + b, 0);
      const magMax = pairs.reduce((m, p) => Math.max(m, Math.hypot(p.dx, p.dy)), 0);
      benchStats.drift = { maxX, maxY, totX, totY, magMax };
      log('drift: peak (' + maxX.toFixed(1) + ', ' + maxY.toFixed(1) + ') px, total (' +
          totX.toFixed(1) + ', ' + totY.toFixed(1) + ') px, max step ' + magMax.toFixed(1) + ' px');
      // persistent trail: store + draw via drawDriftTrail (survives the
      // idle loop's camCx redraws); cleared on next burst start.
      window._driftTrail = { pairs: pairs.map(p => ({ dx: p.dx, dy: p.dy })),
                             scale: 6, text: 'peak (' + maxX.toFixed(1) + ',' + maxY.toFixed(1) + ')' +
                                            ' total (' + totX.toFixed(1) + ',' + totY.toFixed(1) + ')' };
      drawDriftTrail();
    } catch (e) { log('E drift ' + (e && e.message || e)); }
    await paint({ cmd: 'black' });
    } // end else: original all-on movement burst
    // S14L AUTO-SHIP (operator design, 27 Sep): upload starts as soon as the
    // burst ends — the pull is FAST (20 frames ~ 1 s) and safe by
    // construction: the box prints logc chunks ONLY inside the armed LOGP
    // window, so with no console reader the chunks are dropped silently and
    // nothing backs up. benchPulling gates re-entry; benchUploading keeps
    // the Burst button locked out until the upload completes.
    // S14P-1928: CAPTURE-ONLY SKIPS the auto-ship — frames accumulate in
    // benchStore and leave via 'Send frames (all)' (or directive BRAMP), so
    // benchUploading never rises and the Burst button unlocks immediately at
    // the release below (existing path, unchanged).
    if (!capOnly) {
      benchUploading = true; setButtons();
      try { await benchPull(); }
      catch (e) { log('E autoship ' + (e.message || e)); }
      benchUploading = false; setButtons();
    }
  } catch (e) { log('E burst ' + (e && e.message || e)); }
  benchRunning = false;
  scanning = false;   // release: idle preview + manual buttons resume
  setButtons();   // S14M fix: the auto-ship's setButtons ran while benchRunning
                  // was still true — the button froze disabled after the upload
}
async function benchPull() {
  if (benchPulling) return;
  benchPulling = true;
  try {
    if (cwcStats) {
      await sendCmd({ cmd: 'logc', d: 'CWCSTATS ' + JSON.stringify(cwcStats) }, { tries: 2, timeout: 2000 });
      await sleep(30);
    }
    await sendCmd({ cmd: 'logc', d: 'BSTATS ' + JSON.stringify(benchStats || {}) }, { tries: 2, timeout: 2000 });
    await sleep(30);
    log('bench pull: ' + benchStore.length + ' frames');
    for (const f of benchStore) {
      const meta = JSON.stringify({ t: f.t, label: f.label, W: f.W, H: f.H, exp: f.exp });
      await sendCmd({ cmd: 'logc', d: 'FRAME ' + meta }, { tries: 2, timeout: 2000 });
      await sleep(30);
      for (let i = 0; i < f.jpg.length; i += 900) {
        await sendCmd({ cmd: 'logc', d: 'FJPEG ' + f.jpg.slice(i, i + 900) }, { tries: 2, timeout: 2000 });
        await sleep(20);
      }
      await sendCmd({ cmd: 'logc', d: 'FEND' }, { tries: 2, timeout: 2000 });
      await sleep(30);
      if (abortFlag) break;
    }
    await sendCmd({ cmd: 'logend' }, { tries: 2, timeout: 2000 });
    log('bench pull done');
  } catch (e) { log('E benchpull ' + (e && e.message || e)); }
  benchPulling = false;
}

// ---------------- drv? poll: serial directives + CFG ----------------------
let drvPollFail = 0;
async function pollDrvOnce() {
  const r = await sendCmd({ cmd: 'drv?' }, { tries: 1, timeout: 1500 });
  wsOpen = true;
  drvPollFail = 0;
  if (r.cfg) applyCfg(r.cfg);          // cfg BEFORE directives: burst reads CFG synchronously
  const d = r.drv || '';
  if (d === 'BURST') { benchRun(); }
  else if (d === 'BRAMP') { benchPull(); }
  else if (d === 'SCAN') { surveyRun(); }
  else if (d === 'ABRT') { log('drv ABRT'); abortFlag = true; }
  else if (d === 'LOGP') { logPull(); }
}
async function pollDrv() {
  // One retry on failure before giving up: the firmware consumes the
  // drv/cfg slots on this exchange, so a dropped ack would silently lose
  // the directive (S14O lesson). A retry costs nothing when idle.
  try {
    await pollDrvOnce();
  } catch (e) {
    try { await pollDrvOnce(); }
    catch (e2) {
      wsOpen = false; setButtons();
      if (++drvPollFail % 8 === 0) log('drv? failed x' + drvPollFail + ' (' + (e2.message || e2) + ')');
    }
  }
}
setInterval(pollDrv, 1500);

// ---------------- button handlers (BOOT-CALL SAFE: defined before boot) ----

// S14R-0001 (iOS-validated exposure lever): tap the camera view -> AE/AFF
// metering aims there (pointsOfInterest). iOS ignores exposureCompensation

$('cam').addEventListener('pointerdown', (e) => {
  if ((CFG.cwcPoi | 0) !== 1 || scanning) return;
  const r = e.currentTarget.getBoundingClientRect();
  const fx = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
  const fy = Math.max(0, Math.min(1, (e.clientY - r.top) / Math.max(1, r.height)));
  CFG.cwcPoiX = +fx.toFixed(3); CFG.cwcPoiY = +fy.toFixed(3);
  window._saveCfg && window._saveCfg();
  log('poi tap ' + fx.toFixed(2) + ',' + fy.toFixed(2));
  applyPoi();
});

$('btnSendFrames').onclick = async () => {

};
