<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Survey POC</title>
<style>
  html,body{margin:0;background:#111;color:#ddd;font:14px system-ui,sans-serif}
  #wrap{max-width:760px;margin:0 auto;padding:8px}
  #hdr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  #bld{font-weight:700;color:#8cf}
  .st{font-size:12px;padding:1px 8px;border-radius:8px;background:#333}
  .st.ok{background:#173f1e;color:#8f8}
  .st.bad{background:#4a1515;color:#f88}
  video{display:none}
  canvas#cam{width:100%;display:block;background:#000;border-radius:6px}
  #strip{font:12px/1.5 monospace;color:#7d7;margin:4px 0;white-space:pre-wrap}
  #btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  button{background:#2a2a3a;color:#dde;border:1px solid #444;border-radius:6px;
         padding:8px 14px;font-size:14px}
  button:disabled{opacity:.35}
  button.on{background:#1d3a5f;border-color:#3a7}
  #log{height:280px;overflow-y:auto;background:#0a0a0a;border:1px solid #333;
       border-radius:6px;font:11px/1.45 monospace;padding:6px;white-space:pre-wrap}
  #cfgline{font:11px monospace;color:#889;margin:4px 0}
</style>
</head>
<body>
<div id="wrap">
  <div id="hdr">
    <span id="bld">LED Survey POC — <span id="bl2">…</span></span>
    <span class="st" id="wsst">WS: connecting</span>
    <span class="st" id="camst">Cam: starting</span>
  </div>
  <video id="vid" playsinline muted autoplay></video>
  <canvas id="cam" width="640" height="360"></canvas>
  <div id="strip">…</div>
  <div id="cfgline">cfg: —</div>
  <div style="display:flex;gap:8px;align-items:center;margin:4px 0">
    <label for="npx" style="font-size:13px">LEDs:</label>
    <input id="npxin" type="number" min="1" max="200" value="150"
           style="width:80px;background:#1a1a1a;color:#dde;border:1px solid #444;border-radius:4px;padding:4px 6px">
    <span style="font-size:11px;color:#889">(box default applied on connect)</span>
  </div>
  <div id="btns">
    <button id="bSurvey" disabled>Survey</button>
    <button id="bAbort" disabled>Abort</button>
    <button id="bAll" disabled>All-on</button>
    <button id="bAcc" disabled>Accents</button>
    <button id="bOff" disabled>Off</button>
    <button id="bBurst" disabled>Burst</button>
    <button id="bLog" disabled>Download log</button>
    <button id="bClear">Clear boxes</button>
    <button id="bWake">Keep screen on</button>
  </div>
  <div id="log"></div>
</div>
<script>
'use strict';
// LED Survey POC — F1: survey frame + exposure study + reusable blob detector.
// New paradigm (STRATEGY-RESEARCH.md): identity will live in coded light
// patterns, not sequential tracking. This build: machinery + one-shot survey
// of all-on + accent frames, with a detector every later feature reuses.
// Deliberately ABSENT (never reliably worked; made unnecessary): phone->box
// log shipping, pause/resume, session state. One feature at a time.

const BUILD = "S14F-1900";
const $ = (id) => document.getElementById(id);

// ---------------- CFG (serial-tunable, applied on drv? poll) ---------------
const CFG = {
  allB: 160,      // all-on brightness 0-255
  accB: 200,      // accent brightness (colour channel scale)
  grabs: 3,       // grabs per survey mode
  settle: 400,    // ms settle after paint ack, before first grab
  domK: 32,       // blob acceptance: peak >= domK x outside-tail d10
  thrK: 5,        // luma threshold: med + thrK x (d90 - med)
  satFloor: 60,   // absolute saturation floor for accent detection
  colFloor: 40,   // hue-excess floor for R/G/B LED detection (r-max(g,b) etc.)
  domKHue: 8,     // hue-channel dominance bar (see offline_detect results)
  compField: 1,   // 1 = scanning colour C uses a field of the OTHER two
                  // colours (max headroom for C; operator's clipping fix)
  diffThr: 40,    // accent-vs-all-on difference threshold (temporal diff,
                  // bench-proven: green die margin 1.9 at thr 40)
  mergeR: 6.0,    // blob merge: join blobs whose centroids are < mergeR x
                  // sqrt(larger area) apart — Sep 24 bright-room ladder:
                  // MONOTONE 28/5-6/3 fallbacks at 2/4/6 (dim room flat);
                  // 6 = optimal bright, identical to 2 in dim
  darkPair: 0,    // 1 = survey grabs die-on/all-black pairs in a brief dark
                  // window (races the AE); exposure readback per grab
  field2: 0,      // 1 = AE-control field is RED+GREEN only, detect BLUE
                  // accents on the third channel (min cross-contamination)
  evBias: -1,     // exposureCompensation bias (Android only; iOS: none)
  // --- S13 hole survey (operator scheme: all-on master, per-LED all-minus-
  // one pairs; the die is a DARK HOLE in the bright field, luma diff) ---
  holeSurvey: 0,      // 1 = surveyRun runs the hole survey instead of accents
  holeB: 200,         // all-on brightness for master + pairs
  holeSettle: 1000,   // ms AE/AF settle after the MASTER paint (AE recovers
                      // only ~halfway in 300 ms — measured; settle the master)
  holeGap: 100,       // ms between a pair's paint ack and its grab — timing
                      // floor measured Sep 23: 80-100 clean, 60 flaky
  holeMasterEvery: 10,// re-grab the master every K pairs (drift bound; 0=never)
  holeThr: 60,        // hole diff threshold — Sep 23 walk-up: dim plateau
                      // 45-90, cliff at 120; thr=60 = 4 clean runs, 2
                      // fallbacks, (51,101) resolved; bright room holds
                      // (149/148) with thinner margin (pk min 81-88)
  holeDomK: 8,        // hole dominance bar (peak >= domK x outside-tail d10)
  holeAreaFrac: 0.01, // area cap: reject blobs > this fraction of the frame
  holeFrameEvery: 16, // frame-store capture: every Kth pair + every found LED
  holeBatch: 3,       // S13B: LEDs off per pair (1 = the original singles
                      // scheme). Batching needs the holeMap from a previous
                      // singles run + the #0 anchor pair agreeing; ambiguous
                      // groups auto-fall back to singles.
  holeAssignR: 20,    // batch assignment radius (px) around the map position
  holeWinFrac: 0.055, // S13H K-chain window FLOOR: radius as a fraction of
                      // the frame diagonal (0.055 = 45 px @ 406x720) —
                      // the operative window is max(this, 1.5 x measured
                      // median chain pitch)
  holeGateK: 4,       // serpentine gate: reject a hole farther than this
                      // many x median-pitch from its ID neighbours' midpoint
                      // (LED-122 scored 7.8; physical LEDs <= 2)
  holeDimNext: 0,     // 1 = also dim each off-LED's +1 neighbour (operator's
                      // reflection fix: the brightest clip source beside the
                      // hole drops, while the field stays bright for AE)
  holeDimFrac: 0.5,   // dimmed neighbour brightness as a fraction of holeB
  // --- S14 burst bench (frame-rate + handheld motion) ---
  bBurstN: 20,        // frames per burst (2-40)
  bBurstGap: 0,       // ms pacing floor between grab STARTS (0 = as fast as
                      // the camera delivers; try 200 to test 5 fps demand)
  bBurstHold: 1000,   // ms all-on hold before frame 1 (AE settle)
  bBurstB: 150,       // all-on brightness for the burst (150 = 1600-px-safe
                      // per the polyfuse ladder; 150-px string could take more)
  bComp: 0,           // 1 = S14A2 drift compensation: per-frame seeded NCC
                      // estimate vs the burst master, warp the stored frame
                      // back (bilinear), ship measured shifts in BSTATS
};
// S13 defaults (page loads with the hole survey parameters standing — the
// console still overrides via CFG=; compField stays the accent-survey
// default for that dormant path).
CFG.holeSurvey = 1; CFG.holeB = 200; CFG.holeSettle = 1000; CFG.holeGap = 100;
CFG.holeMasterEvery = 10; CFG.holeThr = 15; CFG.holeDomK = 8;
CFG.holeAreaFrac = 0.01; CFG.holeFrameEvery = 16;
CFG.holeBatch = 3; CFG.holeAssignR = 20;
CFG.holeDimNext = 0; CFG.holeDimFrac = 0.5;
CFG.holeThr = 60;
CFG.mergeR = 6;
CFG.holeWinFrac = 0.055; CFG.holeGateK = 4;
function applyCfg(j) {
  if (!j) return;
  let o; try { o = JSON.parse(j); } catch (e) { log('E cfgparse'); return; }
  const touched = [];
  for (const k in o) if (k in CFG && typeof o[k] === 'number' && isFinite(o[k])) {
    CFG[k] = o[k]; touched.push(k + '=' + o[k]);
  }
  if (touched.length) { log('cfg ' + touched.join(',')); showCfg(); }
}
function showCfg() { $('cfgline').textContent =
  'cfg: allB=' + CFG.allB + ' accB=' + CFG.accB + ' grabs=' + CFG.grabs +
  ' settle=' + CFG.settle + ' domK=' + CFG.domK + ' thrK=' + CFG.thrK +
  ' satFloor=' + CFG.satFloor + ' colFloor=' + CFG.colFloor + ' domKHue=' + CFG.domKHue + ' diffThr=' + CFG.diffThr +
  ' holeSurvey=' + CFG.holeSurvey + ' holeB=' + CFG.holeB + ' holeGap=' + CFG.holeGap +
  ' holeThr=' + CFG.holeThr + ' holeDomK=' + CFG.holeDomK + ' holeAreaFrac=' + CFG.holeAreaFrac +
  ' holeBatch=' + CFG.holeBatch + ' holeDimNext=' + CFG.holeDimNext +
  ' holeWinFrac=' + CFG.holeWinFrac + ' holeGateK=' + CFG.holeGateK; }

// ---------------- log ring (page-side only; download button) ---------------
const LOG_MAX_LINES = 400;
const logRing = [];
const t0 = Date.now();
function log(s) {
  const dt = (Date.now() - t0) / 1000;
  const line = 't' + dt.toFixed(1).padStart(6) + ' ' + s;
  logRing.push(line);
  if (logRing.length > LOG_MAX_LINES) logRing.shift();
  const el = $('log');
  el.textContent = logRing.join('\n');
  el.scrollTop = el.scrollHeight;
}
function downloadLog() {
  const blob = new Blob([logRing.join('\n')], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'survey_log_' + BUILD + '_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '') + '.txt';
  a.click();
  log('log downloaded (' + logRing.length + ' lines)');
}

// ---------------- WS: auto-connect, id-matched acks ------------------------
let ws = null, wsOpen = false, cmdId = 0;
const pending = new Map();      // id -> {resolve, reject, timer}
let ackRetries = 0;             // consecutive ack retries -> session recycle
function connectWS() {
  const url = 'wss://' + location.host + '/ws';
  log('ws connect ' + url);
  try { window._ws = new WebSocket(url); } catch (e) { log('E wsopen ' + e); scheduleReconnect(); return; }
  const ws = window._ws;
  ws.onopen = () => { wsOpen = true; $('wsst').textContent = 'WS: open'; $('wsst').className = 'st ok';
    sendCmd({ cmd: 'hello', build: BUILD }); };
  ws.onclose = () => { wsOpen = false; $('wsst').textContent = 'WS: closed'; $('wsst').className = 'st bad';
    for (const [id, p] of pending) { clearTimeout(p.timer); p.reject(new Error('ws closed')); }
    pending.clear(); scheduleReconnect(); };
  ws.onerror = () => { /* onclose follows */ };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.px !== undefined && m.fw === 'poc_survey') {          // hello reply:
      window._npx = m.px;                                       // string length
      const inp = $('npxin');
      if (!inp.dataset.user) inp.value = m.px;                  // box default,
      log('box hello fw=' + m.fw + ' px=' + m.px);              // field wins if edited
      setButtons();
    }
    if (m.id !== undefined && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id); clearTimeout(p.timer);
      ackRetries = 0;
      if (m.ok) p.resolve(m); else p.reject(new Error(m.err || 'nack'));
    }
  };
}
let reconnectAt = 0;
let lastAckRetryLog = 0;
function scheduleReconnect() {
  const wait = Math.min(5000, 500 * Math.pow(2, reconnectAt++));
  log('ws retry in ' + wait + 'ms');
  setTimeout(() => { if (!wsOpen) connectWS(); }, wait);
}
// ack-retry pile-up = the degraded-session signature (25 s -> 2 min surveys).
// After 8 retries in a short window, recycle the WHOLE page: fresh TLS, fresh
// camera, fresh AE — the proven bench reset. One line in the log explains why.
setInterval(() => {
  if (ackRetries >= 8 && !scanning) {
    log('session degraded (' + ackRetries + ' ack retries) — auto-reload');
    sessionStorage.setItem('autoRecycle', '1');
    location.reload();
  }
}, 10000);
function sendCmd(obj, opt) {
  return new Promise((resolve, reject) => {
    if (!wsOpen || !window._ws || window._ws.readyState !== 1) { reject(new Error('ws down')); return; }
    const id = ++cmdId;
    obj.id = id;
    const o = opt || {};
    const tries = o.tries || 2;              // frame paints are idempotent
    const attempt = (left) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        if (left > 0) { log('ack retry id' + id); ackRetries++; attempt(left - 1); }
        else reject(new Error('ack timeout ' + obj.cmd));
      }, o.timeout || 2500);
      pending.set(id, { resolve, reject, timer });
      window._ws.send(JSON.stringify(obj));
    };
    attempt(tries);
  });
}

// ---------------- camera: robust auto-start, single rVFC pump -------------
let stream = null, videoTrack = null, camReady = false, frameIdx = 0;
// Processing dimensions come from the TRACK's real aspect (portrait phone
// cameras report 720x1280-class sizes). Long side capped at 720 for CPU;
// short side scales to match, so nothing is ever squashed.
let W = 640, H = 360;
let lumaArr = null, satArr = null;
const camCv = $('cam'), camCx = camCv.getContext('2d', { willReadFrequently: true });
const procCv = document.createElement('canvas');
const procCx = procCv.getContext('2d', { willReadFrequently: true });
function sizeForVideo(vw, vh) {
  if (!vw || !vh) return;
  const scale = Math.min(1, 720 / Math.max(vw, vh));
  W = Math.max(2, Math.round(vw * scale / 2) * 2);
  H = Math.max(2, Math.round(vh * scale / 2) * 2);
  procCv.width = W; procCv.height = H;
  lumaArr = new Float32Array(W * H); satArr = new Float32Array(W * H);
  rExc = new Float32Array(W * H); gExc = new Float32Array(W * H); bExc = new Float32Array(W * H);
  log('proc ' + W + 'x' + H + ' (video ' + vw + 'x' + vh + ')');
}
let grabResolvers = [];            // rVFC-based grabs (single pump owns rVFC)

function startCamera() {
  $('camst').textContent = 'Cam: requesting';
  const p = navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false });
  Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('gum 12s timeout')), 12000))])
    .then((s) => {
      stream = s;
      videoTrack = s.getVideoTracks()[0];
      const v = $('vid');
      v.srcObject = s;
      $('camst').textContent = 'Cam: playing';
      return v.play();
    })
    .then(() => {
      const vv = $('vid');
      const vw = vv.videoWidth, vh = vv.videoHeight;
      log('cam live ' + vw + 'x' + vh + ' track=' + (videoTrack && videoTrack.label || '?'));
      sizeForVideo(vw, vh);
      camCv.width = W; camCv.height = H;   // display = processing aspect, no squash
      camReady = true; frameIdx = 0;
      $('camst').textContent = 'Cam: live'; $('camst').className = 'st ok';
      applyEvBias();
      pump();
    })
    .catch((e) => {
      log('E cam ' + (e && e.name || e));
      $('camst').textContent = 'Cam: retrying'; $('camst').className = 'st bad';
      const t = setTimeout(startCamera, 8000);          // retry with a timer
      const kick = () => { clearTimeout(t); document.removeEventListener('visibilitychange', kick);
                           camCv.removeEventListener('touchstart', kick); startCamera(); };
      document.addEventListener('visibilitychange', kick);
      camCv.addEventListener('touchstart', kick);       // retry on any touch (gesture)
    });
}
function applyEvBias() {
  try {
    const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
    if (caps && caps.exposureCompensation) {
      const target = Math.max(caps.exposureCompensation.min || -3, Math.min(CFG.evBias, caps.exposureCompensation.max || 3));
      videoTrack.applyConstraints({ advanced: [{ exposureCompensation: target }] })
        .then(() => log('ev bias ' + target)).catch((e) => log('ev bias failed'));
    } else log('ev: not exposed (iOS expected)');
  } catch (e) { log('ev probe failed'); }
}
function expLine() {           // compact exposure readback (platform-dependent)
  try {
    const s = videoTrack.getSettings ? videoTrack.getSettings() : {};
    const parts = [];
    if (s.exposureTime != null) parts.push('exp=' + s.exposureTime);
    if (s.exposureMode) parts.push('aem=' + s.exposureMode);
    if (s.exposureCompensation != null) parts.push('ev=' + s.exposureCompensation);
    if (s.focusDistance != null) parts.push('fd=' + (+s.focusDistance).toFixed(2));
    return parts.join(' ');
  } catch (e) { return ''; }
}
function pump() {              // THE frame pump: metrics ~10Hz, grabs served here
  const v = $('vid');
  const step = () => {
    if (!camReady) return;
    frameIdx++;
    // NOTE: no camCx draw here — the display canvas is owned by the
    // detection passes (idleFrame / grabMode overlay), not the pump.
    if (grabResolvers.length) {
      const rs = grabResolvers; grabResolvers = [];
      for (const r of rs) r();                   // resolvers draw procCx themselves
    } else if (frameIdx % 6 === 0) idleFrame();
    requestVideoFrameCallbackOrTimeout(v, step, 200);   // pump NEVER stops
  };
  requestVideoFrameCallbackOrTimeout(v, step, 200);
}
function requestVideoFrameCallbackOrTimeout(v, fn, ms) {
  if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(() => fn());
  else setTimeout(fn, 33);
}
function grab() {              // resolve on the next real camera frame
  return new Promise((resolve) => {
    const v = $('vid');
    if (v.requestVideoFrameCallback) {
      grabResolvers.push(() => { procCx.drawImage(v, 0, 0, W, H); resolve(); });
    } else {                                     // no rVFC: timer-served grab
      setTimeout(() => { procCx.drawImage(v, 0, 0, W, H); resolve(); }, 100);
    }
  });
}
function grabTimeout() {       // starvation guard: reject if no frame in 3 s
  return Promise.race([grab(), new Promise((_, rej) => setTimeout(() => rej(new Error('rVFC starved')), 3000))]);
}

// ---------------- metrics ---------------------------------------------------
// per-frame compact metrics: peak/median/d90 of luma, clip fractions, blobs
function frameMetrics(d) {     // d = ImageData
  const px = d.data, n = W * H;
  let pk = 0, med = 0, d90 = 0, clipW = 0, clipC = 0, satHi = 0;
  const hist = new Uint32Array(16);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = px[p], g = px[p + 1], b = px[p + 2];
    const luma = r > g ? (r > b ? r : b) : (g > b ? g : b);   // max(r,g,b)
    if (luma > pk) pk = luma;
    hist[luma >> 4]++;
    const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
    const sat = luma - mn;
    if (mn >= 250) clipW++;                                    // white-clipped
    else if (luma >= 250) clipC++;                             // single-channel clip
    if (sat >= 80) satHi++;
  }
  // median + d90 from histogram
  let acc = 0; const q25 = n >> 2, q50 = n >> 1, q90 = (n * 9) >> 4;
  for (let i = 0; i < 16; i++) {
    acc += hist[i];
    if (acc >= q25 && med === 0) med = (i << 4) + 8;
    if (acc >= q50 && d90 === 0) med = (i << 4) + 8;
    if (acc >= q90) { d90 = (i << 4) + 8; break; }
  }
  return { pk, med, d90, clipW, clipC, satHi, n };
}

// ---------------- reusable blob detector -----------------------------------
// chan: Float32Array (W*H) with the detection channel value per pixel
// (luma or saturation). Steps: statistical threshold (med + k*(d90-med),
// optionally floored), flood-fill 4-conn components, per-blob stats,
// outside-tail d10 dominance bar. Returns accepted blobs, brightest first.
function detectBlobs(chan, rgbData, opt) {
  const n = W * H;
  // threshold basis: histogram of chan
  const hist = new Uint32Array(64);
  for (let i = 0; i < n; i++) hist[Math.min(63, chan[i] >> 2)]++;
  let acc = 0, med = 0, d90 = 0;
  const q50 = n >> 1, q90 = (n * 9) >> 4;
  for (let i = 0; i < 64; i++) {
    acc += hist[i];
    if (acc >= q50 && med === 0) med = (i << 2) + 2;
    if (acc >= q90) { d90 = (i << 2) + 2; break; }
  }
  let thr = med + opt.thrK * (d90 - med);
  if (opt.thrFloor != null) thr = Math.max(thr, opt.thrFloor);
  // flood fill
  const seen = new Uint8Array(n);
  const blobs = [];
  const qx = new Int32Array(256), stack = new Int32Array(n);
  for (let s0 = 0; s0 < n; s0++) {
    if (seen[s0] || chan[s0] < thr) continue;
    let sp = 0; stack[sp++] = s0; seen[s0] = 1;
    let cnt = 0, sx = 0, sy = 0, peak = 0, peakIdx = s0;
    const sr = 0, sg = 0, sb = 0;
    let sr2 = 0, sg2 = 0, sb2 = 0;
    while (sp > 0) {
      const idx = stack[--sp];
      cnt++;
      const x = idx % W, y = (idx / W) | 0;
      sx += x; sy += y;
      const v = chan[idx];
      if (v > peak) { peak = v; peakIdx = idx; }
      const p4 = idx * 4;
      sr2 += rgbData[p4]; sg2 += rgbData[p4 + 1]; sb2 += rgbData[p4 + 2];
      if (x > 0 && !seen[idx - 1] && chan[idx - 1] >= thr) { seen[idx - 1] = 1; stack[sp++] = idx - 1; }
      if (x < W - 1 && !seen[idx + 1] && chan[idx + 1] >= thr) { seen[idx + 1] = 1; stack[sp++] = idx + 1; }
      if (y > 0 && !seen[idx - W] && chan[idx - W] >= thr) { seen[idx - W] = 1; stack[sp++] = idx - W; }
      if (y < H - 1 && !seen[idx + W] && chan[idx + W] >= thr) { seen[idx + W] = 1; stack[sp++] = idx + W; }
    }
    if (cnt >= opt.minPx) {
      blobs.push({ cnt, cx: sx / cnt, cy: sy / cnt, peak, peakIdx, pkx: peakIdx % W, pky: (peakIdx / W) | 0,
                   r: sr2 / cnt, g: sg2 / cnt, b: sb2 / cnt });
    }
  }
  blobs.sort((a, b) => b.peak - a.peak);
  // dominance bar: mean of the top decile of chan OUTSIDE every blob's pixel
  // (candidate never lifts its own bar; B109 d10out, whole-frame form)
  const inBlob = seen;         // 'seen' now marks exactly the blob pixels
  const tail = [];
  for (let i = 0; i < n; i += 2) if (!inBlob[i]) tail.push(chan[i]);   // subsample x2
  tail.sort((a, b) => b - a);
  const k = Math.max(1, Math.floor(tail.length / 10));
  let d10out = 0;
  for (let i = 0; i < k; i++) d10out += tail[i];
  d10out /= k;
  const accepted = [];
  for (const b of blobs) {
    if (b.peak >= opt.domK * Math.max(1, d10out)) { b.d10out = d10out; accepted.push(b); }
    else break;                // sorted by peak; first fail ends the accepted set
  }
  return { blobs, accepted, thr, med, d90, d10out };
}
function hueClass(b) {         // mean-rgb -> R/G/B/W by dominance
  const r = b.r, g = b.g, bl = b.b;
  const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl);
  const sat = mx - mn;
  if (sat < 50) return 'W';
  if (r === mx && r > 1.25 * g && r > 1.25 * bl) return 'R';
  if (g === mx && g > 1.25 * r && g > 1.25 * bl) return 'G';
  if (bl === mx && bl > 1.25 * r && bl > 1.25 * g) return 'B';
  return '?';
}

// channel builders from ImageData
function buildChannels(d) {
  const px = d.data;
  for (let i = 0, p = 0; i < lumaArr.length; i++, p += 4) {
    const r = px[p], g = px[p + 1], b = px[p + 2];
    const luma = r > g ? (r > b ? r : b) : (g > b ? g : b);
    lumaArr[i] = luma;
    satArr[i] = luma - (r < g ? (r < b ? r : b) : (g < b ? g : b));
  }
}

// difference-blob detection: signed difference array (accent - all-on),
// absolute threshold, flood fill, dominance vs outside positive tail.
// Bench-proven (offline_diff2.py, Sep 22): static scene cancels; the die is
// the only residual (green: pk130 n77, margin 1.9 at thr40).
function detectDiffBlobs(diffArr, thr, domK, mergeR) {
  const n = W * H;
  const seen = new Uint8Array(n);
  const stack = new Int32Array(n);
  const blobs = [];
  for (let s0 = 0; s0 < n; s0++) {
    if (seen[s0] || diffArr[s0] < thr) continue;
    let sp = 0; stack[sp++] = s0; seen[s0] = 1;
    let cnt = 0, sx = 0, sy = 0, peak = 0, sw = 0, wx = 0, wy = 0;
    while (sp > 0) {
      const idx = stack[--sp];
      cnt++;
      const x = idx % W, y = (idx / W) | 0;
      sx += x; sy += y;
      const v = diffArr[idx];
      if (v > peak) peak = v;
      // LUMA-WEIGHTED CENTROID (S13F): weight each pixel by its depth above
      // threshold, pulling the position to the hole's darkest point instead
      // of the geometric middle of the bloom's skirts.
      const wgt = v - thr;
      sw += wgt; wx += x * wgt; wy += y * wgt;
      if (x > 0 && !seen[idx - 1] && diffArr[idx - 1] >= thr) { seen[idx - 1] = 1; stack[sp++] = idx - 1; }
      if (x < W - 1 && !seen[idx + 1] && diffArr[idx + 1] >= thr) { seen[idx + 1] = 1; stack[sp++] = idx + 1; }
      if (y > 0 && !seen[idx - W] && diffArr[idx - W] >= thr) { seen[idx - W] = 1; stack[sp++] = idx - W; }
      if (y < H - 1 && !seen[idx + W] && diffArr[idx + W] >= thr) { seen[idx + W] = 1; stack[sp++] = idx + W; }
    }
    if (cnt >= 2) blobs.push({ cnt, cx: sx / cnt, cy: sy / cnt,
      wcx: sw > 0 ? wx / sw : sx / cnt, wcy: sw > 0 ? wy / sw : sy / cnt, peak });
  }
  blobs.sort((a, b) => b.peak - a.peak);
  // BLOOM MERGE (S11): a clipped die fragments into peak + halo blobs
  // (bench: G p60n10 + p48n6 3 px apart). Merge blobs whose centroids are
  // within mergeR x the larger blob's radius. Repeat until stable.
  if (mergeR) {
    let merged = true;
    while (merged && blobs.length > 1) {
      merged = false;
      outer:
      for (let i = 0; i < blobs.length; i++) {
        for (let j = i + 1; j < blobs.length; j++) {
          const a2 = blobs[i], b2 = blobs[j];
          const ra = Math.sqrt(a2.cnt / Math.PI), rb = Math.sqrt(b2.cnt / Math.PI);
          const dist = Math.hypot(a2.cx - b2.cx, a2.cy - b2.cy);
          if (dist < mergeR * Math.max(ra, rb)) {
            const nA = a2.cnt, nB = b2.cnt;
            a2.cx = (a2.cx * nA + b2.cx * nB) / (nA + nB);
            a2.cy = (a2.cy * nA + b2.cy * nB) / (nA + nB);
            a2.cnt = nA + nB;
            a2.peak = Math.max(a2.peak, b2.peak);
            blobs.splice(j, 1);
            merged = true;
            break outer;
          }
        }
      }
    }
  }
  const tail = [];
  const inB = seen;
  for (let i = 0; i < n; i += 2) if (!inB[i] && diffArr[i] > 0) tail.push(diffArr[i]);
  tail.sort((a, b) => b - a);
  const k = Math.max(1, Math.floor(tail.length / 10));
  let d10out = 0;
  for (let i = 0; i < k; i++) d10out += tail[i];
  d10out /= k;
  const accepted = [];
  for (const b of blobs) {
    if (b.peak >= domK * Math.max(1, d10out)) { b.d10out = d10out; accepted.push(b); }
    else break;
  }
  return { blobs, accepted, thr, d10out };
}

      await sleep(CFG.holeGap);
      await grabTimeout();
      const d = procCx.getImageData(0, 0, W, H);
      buildChannels(d);
      masterLuma = Float32Array.from(lumaArr);
      sinceMaster = 0;
      log('hole master regrabbed at pair ' + at);
    };
    // chain state: chainPos[c] = last located LED position in chain c
    // (anchor first, then each resolved batch member extends its chain)
    const chainPos = [];
    // WINDOW GEOMETRY (S13K, operator spec): the window RADIUS is
    // max(holeWinFrac x frame diagonal, 1.5 x MEASURED median pitch) —
    // the diagonal-derived value is a FLOOR, never the operative size when
    // the string's pitch is larger. Median pitch comes from the PREVIOUS
    // run's map (updated every run); before the first map exists it falls
    // back to the floor alone.
    const chainPitch = [];                      // median pitch per chain (px)
    const winRFor = (c) => Math.max(
      winR,                                     // floor: holeWinFrac x diag
      1.5 * (chainPitch[c] || 0));              // 1.5x measured median pitch
    const inWindowNow = (c, h) => !chainPos[c] ||
      Math.hypot(h.wcx - chainPos[c].x, h.wcy - chainPos[c].y) <= winRFor(c);
    const runSingles = async (idxs, constrained) => {
      // single-LED pairs; when constrained, each index i searches only inside
      // its CHAIN's window (chain c for index i is a RANGE: floor(i/stride))
      // called from a batch fallback; for the anchor pass it is whole-frame).
      for (const i of idxs) {
        if (abortFlag) break;
        if (CFG.holeMasterEvery > 0 && sinceMaster >= CFG.holeMasterEvery) await regrabMaster(i);
        const p = [];
        for (let j = 0; j < npx; j++) p.push(j === i ? null : 'W');
        if (CFG.holeDimNext === 1) {
          const nb = (i + 1) % npx;
          p[nb] = 'H';
        }
        await paint({ cmd: 'frame', b: bUsed, p });
        const det = await grabDiff();
        const cands = det.accepted.filter((b) => b.cnt <= capPx);
        // S13I: pick the brightest IN-WINDOW hole, not the global brightest —
        // at mergeR=2 a bloom fragment can outshine the real hole, and a
        // global-brightest pick then fails the window test while the real
        // hole sits inside the window unused. Window size = max(floor,
        // 1.5x measured chain pitch) — measured from the previous run's map.
        let pick = null;
        if (constrained) {
          const c = Math.min(K - 1, Math.floor(i / stride));   // RANGE mapping
          const inWin = cands.filter((b) => inWindowNow(c, b));
          pick = inWin.length ? inWin[0] : null;
          if (!pick && cands.length)
            log('h' + i + ' ' + cands.length + ' candidates, none in chain-' + c +
                ' window (r=' + Math.round(winRFor(c)) + 'px, pitch ' +
                Math.round(chainPitch[c] || 0) + ', chainPos ' +
                (chainPos[c] ? Math.round(chainPos[c].x) + ',' + Math.round(chainPos[c].y) : '?') + ') — miss');
        } else {
          pick = cands.length ? cands[0] : null;
        }
        setVerdict(i, pick, det);
        if (pick && constrained) {
          const c = Math.min(K - 1, Math.floor(i / stride));
          // per-step measured pitch, exponential average (alpha=0.5) —
          // this chain's OWN local pitch, robust to single outliers.
          // Computed BEFORE chainPos overwrites: previous chain LED is
          // chainPos[c]'s pre-update value.
          if (chainPos[c]) {
            const step = Math.hypot(pick.wcx - chainPos[c].x, pick.wcy - chainPos[c].y);
            if (step > 0 && step < winR * 4)        // sane steps only
              chainPitch[c] = chainPitch[c] ? chainPitch[c] * 0.5 + step * 0.5 : step;
          }
          chainPos[c] = { x: pick.wcx, y: pick.wcy };
        }
        camCx.drawImage($('vid'), 0, 0, W, H);
        drawHoleBoxes();
        if (pick || i % CFG.holeFrameEvery === 0) captureFrame('hole:p' + i, det);
        sinceMaster++;
        if (i % 25 === 24) log('hole progress ' + (i + 1) + '/' + npx +
          ' (' + Math.round((performance.now() - tRun) / 1000) + 's)');
      }
    };
    // K ANCHOR PAIRS (operator-directed): one single-LED pair per chain,
    // double-grabbed, positions must agree <= 5 px
    const anchors = [];
    for (let c = 0; c < K; c++) {
      const i = c * stride;               // operator spec: anchors at 0, 50, 100
                                          // (the stride multiples = chain starts)
      const p = [];
      for (let j = 0; j < npx; j++) p.push(j === i ? null : 'W');
      await paint({ cmd: 'frame', b: bUsed, p });
      const detA = await grabDiff();
      await paint({ cmd: 'frame', b: bUsed, p });   // re-paint the SAME frame for a second grab
      const detB = await grabDiff();
      const candsA = detA.accepted.filter((b) => b.cnt <= capPx);
      const candsB = detB.accepted.filter((b) => b.cnt <= capPx);
      const a = candsA.length ? candsA[0] : null;
      const bB = candsB.length ? candsB[0] : null;
      const stable = a && bB && Math.hypot(a.wcx - bB.wcx, a.wcy - bB.wcy) <= 5;
      if (a && stable) {
        setVerdict(i, a, detA);
        chainPos[c] = { x: a.wcx, y: a.wcy };
        log('hole anchor chain-' + c + ' LED#' + i + ' @(' + Math.round(a.wcx) + ',' +
            Math.round(a.wcy) + ') stable');
        anchors.push(c);
      } else {
        setVerdict(i, a, detA);
        log('hole anchor chain-' + c + ' LED#' + i + ' UNSTABLE/MISSING (' +
            (a ? 'shifted ' + (a && bB ? Math.round(Math.hypot(a.wcx - bB.wcx, a.wcy - bB.wcy)) : '?') + 'px' : 'no hole') +
            ') — chain runs UNCONSTRAINED');
        anchors.push(-c - 100);   // marker: unconstrained chain
      }
      sinceMaster += 2;
      camCx.drawImage($('vid'), 0, 0, W, H);
      drawHoleBoxes();
      if (a) captureFrame('hole:a' + i, detA);
    }
    log('hole K-chain run: K=' + K + ' anchors ' +
        anchors.filter((c) => c >= 0).length + '/' + K + ' stable, winR=' + winR + 'px');
    // K-SPACED BATCH GROUPS with per-chain window assignment
    {
      const seen = new Set();               // indices already decided (anchors)
      for (const c of anchors) if (c >= 0) seen.add(c * stride);
      let processed = 0;
      for (let g = 0; g < stride && !abortFlag; g++) {
        if (CFG.holeMasterEvery > 0 && sinceMaster >= CFG.holeMasterEvery) await regrabMaster(g);
        const idxs = [];
        for (let j = 0; j < K; j++) { const v = 1 + g + j * stride; if (v < npx && !seen.has(v)) idxs.push(v); }
        await paint({ cmd: 'frame', b: bUsed, p: (() => {
          const p = [];
          for (let j = 0; j < npx; j++) p.push(idxs.includes(j) ? null : 'W');
          if (CFG.holeDimNext === 1) {
            for (const i of idxs) {
              const nb = (i + 1) % npx;
              if (!idxs.includes(nb)) p[nb] = 'H';
            }
          }
          return p;
        })() });
        const det = await grabDiff();
        const holes = det.accepted.filter((b) => b.cnt <= capPx);

        // windows ESCALATE per consecutive chain miss (winRFor)
        const groups = idxs.map((i) => {
          const c = Math.min(K - 1, Math.floor(i / stride));
          return { i, c, cands: holes.filter((h) => inWindowNow(c, h)) };
        });
        const taken = new Set();
        const resolved = groups.every((gr) => gr.cands.length === 1) &&
          groups.every((gr) => { const h = gr.cands[0];
            if (taken.has(h)) return false; taken.add(h); return true; });
        if (resolved) {
          const now = performance.now();
          for (const gr of groups) {
            const h = gr.cands[0];
            holeBoxes.set(gr.i, { x: h.wcx, y: h.wcy, r: Math.sqrt(h.cnt / Math.PI) + 6,
              pk: Math.round(h.peak), miss: false, ts: now });
            found.push(gr.i);
            // per-step measured pitch (exp average, alpha=0.5), BEFORE the
            // chainPos overwrite — same as the singles path
            if (chainPos[gr.c]) {
              const step = Math.hypot(h.wcx - chainPos[gr.c].x, h.wcy - chainPos[gr.c].y);
              if (step > 0 && step < winR * 4)
                chainPitch[gr.c] = chainPitch[gr.c] ? chainPitch[gr.c] * 0.5 + step * 0.5 : step;
            }
            chainPos[gr.c] = { x: h.wcx, y: h.wcy };
            log('h' + gr.i + ' FOUND pk' + Math.round(h.peak) + ' n' + h.cnt +
                ' @(' + Math.round(h.wcx) + ',' + Math.round(h.wcy) + ') bK' + idxs.length);
          }
          if (idxs[0] % CFG.holeFrameEvery === 0) captureFrame('hole:g' + idxs[0], det);
        } else {
          log('hole batch [' + idxs.join(',') + '] ambiguous/out-of-window (' +
              holes.length + ' holes) -> constrained singles fallback');
          await runSingles(idxs, true);
        }
        processed += idxs.length;
        sinceMaster++;
        if (processed % 25 === 0 || processed >= npx - 1)
          log('hole progress ' + (processed + 1) + '/' + npx + ' (' +
              Math.round((performance.now() - tRun) / 1000) + 's)');
      }
    }
    // POST-RUN SERPENTINE AUDIT (F2 gate, operator-directed after LED-122):
    // deviation from the midpoint of the ID neighbours, in units of the
    // measured median pitch. > holeGateK pitches => the accepted hole is an
    // IMPOSTOR: reject it, mark the index HIDDEN, interpolate the position
    // from the neighbours. Neighbour midpoints use ONLY non-HIDDEN positions
    // (a rejected index must not poison the next pass). Also flags holes
    // within ~10 px of a frame edge for review.
    {
      const posOf = (i) => {
        const b = holeBoxes.get(i);
        return b && !b.miss && b.x >= 0 ? { x: b.x, y: b.y } : null;
      };
      const hidden = new Set();
      for (let i = 0; i < npx; i++) {
        const self = posOf(i);
        if (!self) continue;
        if (self.x <= 10 || self.x >= W - 10 || self.y <= 10 || self.y >= H - 10)
          log('h' + i + ' EDGE FLAG: hole within ~10 px of the frame edge @(' +
              Math.round(self.x) + ',' + Math.round(self.y) + ') — review');
      }
      const pitchOf = (i) => {                     // median local pitch
        const a = posOf(i - 1), b = posOf(i + 1);
        if (!a || !b) return null;
        return Math.hypot(b.x - a.x, b.y - a.y) / 2;
      };
      const pitches = [];
      for (let i = 2; i < npx - 2; i++) {
        const p = pitchOf(i);
        if (p && p > 0) pitches.push(p);
      }
      pitches.sort((x, y) => x - y);
      const medPitch = pitches.length ? pitches[Math.floor(pitches.length / 2)] : 0;
      let auditChanged = true, passes = 0;
      while (auditChanged && passes < 3) {         // iterate: rejections unpoison
        auditChanged = false;
        passes++;
        for (let i = 1; i < npx - 1 && !abortFlag; i++) {
          if (hidden.has(i)) continue;
          const self = posOf(i);
          if (!self) continue;
          // nearest non-hidden neighbours at i-1/-2, i+1/+2
          let a = null, aI = 0, b = null, bI = 0;
          for (let d = 1; d <= 2 && !a; d++) { const q = posOf(i - d);
            if (q && !hidden.has(i - d)) { a = q; aI = i - d; } }
          for (let d = 1; d <= 2 && !b; d++) { const q = posOf(i + d);
            if (q && !hidden.has(i + d)) { b = q; bI = i + d; } }
          if (!a || !b) continue;
          const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          const dev = Math.hypot(self.x - mid.x, self.y - mid.y);
          const pitch = Math.max(1, medPitch);
          if (dev > CFG.holeGateK * pitch) {
            const ni = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
            holeBoxes.set(i, { x: ni.x, y: ni.y, r: 6, pk: 0, miss: true, ts: performance.now(), hid: true });
            hidden.add(i);
            auditChanged = true;
            log('h' + i + ' SERPENTINE REJECT: dev ' + Math.round(dev) + 'px = ' +
                (dev / pitch).toFixed(1) + 'x pitch (> ' + CFG.holeGateK + ') between ' + aI +
                '/' + bI + ' — HIDDEN, interpolated @(' + Math.round(ni.x) + ',' + Math.round(ni.y) + ')');
          }
        }
      }
      log('hole serpentine audit: ' + hidden.size + ' hidden, median pitch ' +
          Math.round(medPitch) + 'px, gate ' + CFG.holeGateK + 'x, ' + passes + ' pass(es)');
      if (missed.length || hidden.size) {
        log('hidden indices: ' + (hidden.size ? Array.from(hidden).join(',') : '(none)'));
      }
    }
    // POSITION MAP (F2 seed): every LED this run located (HIDDEN entries excluded)
    holeMap.clear();
    for (const [i, b] of holeBoxes) if (!b.miss && b.x >= 0 && !b.hid) holeMap.set(i, { x: b.x, y: b.y });
    log('hole map saved (' + holeMap.size + ' entries)');
    await paint({ cmd: 'black' });
    log('hole survey done: ' + found.length + ' found, ' + missed.length +
        ' missed in ' + Math.round((performance.now() - tRun) / 1000) + 's' +
        (missed.length ? ' misses: ' + missed.join(',') : ''));
    evid.hole = { build: BUILD, px: npx, allB: bUsed, thr: CFG.holeThr,
      domK: CFG.holeDomK, foundN: found.length, missedN: missed.length,
      found: found, missed: missed };
  } catch (e) {
    log('E holesurvey ' + (e && e.message || e));
    try { await paint({ cmd: 'black' }); } catch (e2) {}
  } finally {
    scanning = false; setButtons();
    let evStr;
    try { evStr = JSON.stringify(evid.hole || { build: BUILD, err: 'no evidence' }); }
    catch (e2) { evStr = '{"err":"evid stringify"}'; }
    log('evid ' + evStr.length + 'B');
    if (evStr.length <= 1100) sendCmd({ cmd: 'evid', e: evStr }).catch(() => log('E evid ship'));
    else log('E evid too big — full data in page log');
  }
}
function modeSummary(mo) {
  const fr = mo.frames.filter(Boolean);
  const name = mo.acc ? 'acc:' + mo.acc : mo.mode;
  if (!fr.length) return { m: name, nb: 0 };
  const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
  const last = fr[fr.length - 1];
  const s = { m: name, pk: med(fr.map((f) => f.m.pk)),
    cw: +med(fr.map((f) => 100 * f.m.clipW / f.m.n)).toFixed(2),
    nb: last.accs.length, e: last.exp };
  if (mo.acc) s.b = last.accs.slice(0, 4).map((a) => a.h + '@' + a.x + ',' + a.y + 'p' + a.pk + 'n' + a.n);
  if (mo.acc && mo.frames.length && mo.frames[mo.frames.length - 1].det) s.dc = mo.frames[mo.frames.length - 1].det;
  return s;
}
function accentIdx(nm) {       // spread accents along the string, not at ends
  const n = window._npx || 10;

}

    await grabTimeout();
    try {
      const d = procCx.getImageData(0, 0, W, H);
      lastGrab = d;
      buildChannels(d);
      const isAcc = !!accName;
      const opt = isAcc
        ? { thrK: CFG.thrK, thrFloor: CFG.satFloor, domK: CFG.domK, minPx: 2 }
        : { thrK: CFG.thrK, thrFloor: null, domK: CFG.domK, minPx: 2 };
      let det, accs;
      const m = frameMetrics(d);
      if (isAcc && allOnRef) {
        // TEMPORAL DIFF path (bench-proven): accent minus all-on cancels the
        // static scene; the die is the only residual. Detect per colour.
        const now = performance.now();
        const pxNow = d.data;
        buildChannels(d); buildColourExcess(d);
        const dR = new Float32Array(W * H), dG = new Float32Array(W * H), dB = new Float32Array(W * H);
        for (let i = 0; i < dR.length; i++) {
          dR[i] = rExc[i] - allOnExc.R[i];
          dG[i] = gExc[i] - allOnExc.G[i];
          dB[i] = bExc[i] - allOnExc.B[i];
        }
        const o = { thr: CFG.diffThr, domK: CFG.domKHue };
        const dets = { R: detectDiffBlobs(dR, CFG.diffThr, CFG.domKHue, CFG.mergeR),
                       G: detectDiffBlobs(dG, CFG.diffThr, CFG.domKHue, CFG.mergeR),
                       B: detectDiffBlobs(dB, CFG.diffThr, CFG.domKHue, CFG.mergeR) };
        det = { R: dets.R, G: dets.G, B: dets.B, diff: true };
        updateLedBoxesDiff(dets);
        camCx.drawImage($('vid'), 0, 0, W, H);
        drawLedBoxes();
        accs = ['R', 'G', 'B'].flatMap((h) => dets[h].accepted.map((b) => ({ x: Math.round(b.cx), y: Math.round(b.cy),
          pk: Math.round(b.peak), n: b.cnt, h })));
        captureFrame('survey:' + (accName || mode), det);
      } else if (isAcc) {
        det = detectColours(d);
        updateLedBoxes(det);
        camCx.drawImage($('vid'), 0, 0, W, H);
        drawLedBoxes();
        accs = ['R', 'G', 'B'].flatMap((h) => det[h].accepted.map((b) => ({ x: Math.round(b.cx), y: Math.round(b.cy),
          pk: Math.round(b.peak), n: b.cnt, h })));
        captureFrame('survey:' + (accName || mode), det);

        det = detectBlobs(lumaArr, d.data, opt);
        drawOverlay(det);
        drawLedBoxes();

          pk: Math.round(b.peak), n: b.cnt, h: hueClass(b) }));
        captureFrame('survey:' + mode, det);
      }
      frames.push({ m, accs, exp: expLine() });

        ' pk' + m.pk + ' cw' + (100 * m.clipW / m.n).toFixed(1) + '% bl' + accs.length +
        (accs.length ? ' ' + accs.map((a) => a.h + '(' + a.x + ',' + a.y + ')p' + a.pk).join(' ') : ''));
    } catch (e) { log('E grab ' + (e && e.message || e)); }
  }

}

let wakeLock = null;

  try {
    if (!('wakeLock' in navigator)) { log('wake: not supported (iOS Safari — use Settings > Auto-Lock)'); return; }
    wakeLock = await navigator.wakeLock.request('screen');
    log('wake lock acquired');

      log('wake lock released (tab hidden?)');

  pollBusy = false;
  if (ackRetries > 0 && pending.size === 0) ackRetries = Math.max(0, ackRetries - 1);
}, 1500);

// on-demand log pull (bench sends LOGP when a serial reader is attached):
// chunk the ring to the box with acked sends — 6 lines per 60 ms, proven
// pacing from the old build, but ONLY when asked (nothing in the background)
let pulling = false;
async function logPull() {
  if (pulling || scanning) return;
  pulling = true;
  try {
    log('log pull: ' + logRing.length + ' lines');
    for (let i = 0; i < logRing.length; i += 6) {
      const chunk = logRing.slice(i, i + 6).join('\n');
      await sendCmd({ cmd: 'logc', d: chunk }, { tries: 2, timeout: 2000 });
      await sleep(60);
      if (abortFlag) break;
    }
    await sendCmd({ cmd: 'logend' }, { tries: 2, timeout: 2000 });
    log('log pull done');
  } catch (e) { log('E logpull ' + (e && e.message || e)); }
  pulling = false;
}

// FRAMP pull: chunk the frame store through logc (the box prints [PHONE]
// lines; the bench decodes base64 JPEGs from them). Same pacing as logPull.
let framePulling = false;
async function framePull() {
  if (framePulling || scanning) return;
  framePulling = true;
  try {
    log('frame pull: ' + frameStore.length + ' frames');
    for (const f of frameStore) {
      const meta = JSON.stringify({ t: f.t, label: f.label, W: f.W, H: f.H, exp: f.exp, det: f.det });
      await sendCmd({ cmd: 'logc', d: 'FRAME ' + meta }, { tries: 2, timeout: 2000 });
      await sleep(30);
      for (let i = 0; i < f.jpg.length; i += 900) {
        await sendCmd({ cmd: 'logc', d: 'FJPEG ' + f.jpg.slice(i, i + 900) }, { tries: 2, timeout: 2000 });
        await sleep(20);
      }
      await sendCmd({ cmd: 'logc', d: 'FEND' }, { tries: 2, timeout: 2000 });
      await sleep(30);
    if (abortFlag) break;
    }
    await sendCmd({ cmd: 'logc', d: 'FSTATS ' + JSON.stringify(benchStats) }, { tries: 2, timeout: 2000 });
    await sleep(30);
    await sendCmd({ cmd: 'logend' }, { tries: 2, timeout: 2000 });
    log('frame pull done');
  } catch (e) { log('E framepull ' + (e && e.message || e)); }
  framePulling = false;
}

// ---------------- S14 burst bench (Oliver, Sep 25) -------------------------
// Goal: measure real phone frame cadence + handheld motion, in ONE burst,
// box-driven. Store FULL-RESOLUTION frames in a dedicated ring (the main
// frameStore downscales to 320 px) so registration + blob reads are honest.
// Console drives via drv BURST / BRAMP; CFG keys: bBurst{N,Gap,Hold,Dur}.
const benchMax = 48;                  // ~30 s at 1.5 Hz worst case
const benchStore = [];                // full-res JPEGs + grab timing
let benchStats = null;                // per-run cadence summary (ships in pull)
let benchRunning = false;
let benchPulling = false;
function benchCapture(label) {
  // synchronous snapshot AFTER an awaited grab(); t is wall-clock ms
  try {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    c.getContext('2d').drawImage(camCv, 0, 0, W, H);
    const jpg = c.toDataURL('image/jpeg', 0.5).split(',')[1];
    benchStore.push({ t: ((Date.now() - t0) / 1000).toFixed(3), label, W, H,
                      exp: expLine(), jpg });
    if (benchStore.length > benchMax) benchStore.shift();
  } catch (e) { log('E benchcap ' + (e && e.message || e)); }
}
// phase correlation in-page: NCC on a 128-wide decimated grid
// v2 (actual): downsample both to 256x144, FFT via cv-style naive 2D DFT on
// the SMALL grid is still heavy in pure JS... pragmatic: use spatial-domain
// normalised cross-correlation on a coarse grid via direct convolution at
// 128x72 decimated resolution — good to ±1 px, cheap, and the remainder is
// measured CONSOLE-side in analyse (which stays the ground truth).
function phaseCorrJS(refLuma, curLuma) {
  const DW = 128, DH = Math.round(128 * H / W / 2) * 2 || 72;
  const a = new Float32Array(DW * DH), b = new Float32Array(DW * DH);
  for (let y = 0; y < DH; y++) {
    const sy = Math.min(H - 1, Math.round(y * H / DH));
    for (let x = 0; x < DW; x++) {
      const sx = Math.min(W - 1, Math.round(x * W / DW));
      a[y * DW + x] = refLuma[sy * W + sx];
      b[y * DW + x] = curLuma[sy * W + sx];
    }
  }
  // normalised cross-correlation over ±12 px search, 1 px steps
  let best = -1e9, bdx = 0, bdy = 0;
  const mean = (arr) => { let s = 0; for (let i = 0; i < arr.length; i++) s += arr[i]; return s / arr.length; };
  const ma = mean(a);
  const aC = new Float32Array(a.length);
  for (let i = 0; i < a.length; i++) aC[i] = a[i] - ma;
  let a2 = 0; for (let i = 0; i < aC.length; i++) a2 += aC[i] * aC[i];
  a2 = Math.sqrt(a2);
  const mb = mean(b);
  const bC = new Float32Array(b.length);
  for (let i = 0; i < b.length; i++) bC[i] = b[i] - mb;
  for (let dy = -12; dy <= 12; dy++) {
    for (let dx = -12; dx <= 12; dx++) {
      let s = 0, b2 = 0;
      for (let y = 0; y < DH; y++) {
        const sy = y + dy;
        if (sy < 0 || sy >= DH) continue;
        for (let x = 0; x < DW; x++) {
          const sx = x + dx;
          if (sx < 0 || sx >= DW) continue;
          const v = bC[sy * DW + sx];
          s += aC[y * DW + x] * v;
          b2 += v * v;
        }
      }
      b2 = Math.sqrt(b2);
      const ncc = (a2 * b2) > 0 ? s / (a2 * b2) : 0;
      if (ncc > best) { best = ncc; bdx = dx; bdy = dy; }
    }
  }
  // Return the MEASURED MOTION of cur relative to ref: (bdx, bdy) is where
  // cur must be sampled from to align with ref (verified in numpy: content
  // moved (+10,+5) => best (+10,+5) => corrected[y] = cur[y+10] = ref[y]).
  // The warp in benchCaptureComp consumes exactly this sign.
  return { dx: bdx, dy: bdy, conf: Math.max(0, best) };
}
// corrected capture: warp the ORIGINAL camera pixels back by -(tot) using
// bilinear sampling from procCx's current ImageData
let benchLastLuma = null;   // raw ImageData of the last grab (set by benchRun)
function benchCaptureComp(label, tot) {
  try {
    const d = procCx.getImageData(0, 0, W, H);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cx = c.getContext('2d');
    // warp: build corrected ImageData by bilinear sampling at (x+dx, y+dy)
    const out = cx.createImageData(W, H);
    const dx = tot.dx, dy = tot.dy;
    for (let y = 0; y < H; y++) {
      const fy = y + dy;
      const y0 = Math.floor(fy), ty = fy - y0;
      const y0c = Math.max(0, Math.min(H - 1, y0));
      const y1c = Math.max(0, Math.min(H - 1, y0 + 1));
      for (let x = 0; x < W; x++) {
        const fx = x + dx;
        const x0 = Math.floor(fx), tx = fx - x0;
        const x0c = Math.max(0, Math.min(W - 1, x0));
        const x1c = Math.max(0, Math.min(W - 1, x0 + 1));
        const o = (y * W + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          const v00 = d.data[(y0c * W + x0c) * 4 + ch];
          const v10 = d.data[(y0c * W + x1c) * 4 + ch];
          const v01 = d.data[(y1c * W + x0c) * 4 + ch];
          const v11 = d.data[(y1c * W + x1c) * 4 + ch];
          out.data[o + ch] = v00 * (1 - tx) * (1 - ty) + v10 * tx * (1 - ty) +
                             v01 * (1 - tx) * ty + v11 * tx * ty;
        }
        out.data[o + 3] = 255;
      }
    }
    cx.putImageData(out, 0, 0);
    const jpg = c.toDataURL('image/jpeg', 0.5).split(',')[1];
    benchStore.push({ t: ((Date.now() - t0) / 1000).toFixed(3), label, W, H,
                      exp: expLine() + ' comp=' + tot.dx.toFixed(2) + ',' + tot.dy.toFixed(2) + '@' + tot.conf.toFixed(2), jpg });
    if (benchStore.length > benchMax) benchStore.shift();
  } catch (e) { log('E benchcapcomp ' + (e && e.message || e)); }
}
async function benchRun() {
  if (benchRunning || !wsOpen || !camReady) { log('E burst: not ready'); return; }
  benchRunning = true;
  try {
    const n = Math.max(2, Math.min(40, CFG.bBurstN | 0 || 20));
    const gap = Math.max(0, CFG.bBurstGap | 0);
    const hold = Math.max(0, CFG.bBurstHold | 0);
    const b = Math.max(20, Math.min(255, CFG.bBurstB | 0 || CFG.holeB));
    benchStore.length = 0; benchStats = null;
    log('burst: all-on ' + b + ' hold ' + hold + 'ms');
    await paint({ cmd: 'all', b });
    const tHold0 = Date.now();
    while (Date.now() - tHold0 < hold) await sleep(20);   // AE settle
    const gts = [];
    // ---- drift compensation (S14A2, Oliver's seeded scheme) -------------
    // After each grab, estimate the frame's motion vs the MASTER frame and
    // CORRECT the stored pixels: warpAffine by the seeded transform, so the
    // stored frames are already registered to master. Console-side analyse
    // then sees ~0 shift on a still rig, and the residual stats measure the
    // compensation quality directly. Seed = last composed T (no prediction).
    // Also ship the measured (dx, dy) per frame in the FRAME meta + BSTATS.
    if (!window._benchComp) window._benchComp = { on: false };
    const comp = CFG.bComp | 0;
    let masterLuma = null;
    if (comp) {
      await grabTimeout();                       // FRESH all-on frame into procCx
      const dm = procCx.getImageData(0, 0, W, H);
      masterLuma = new Float32Array(W * H);
      for (let i = 0, p = 0; i < masterLuma.length; i++, p += 4) {
        const r = dm.data[p], g = dm.data[p + 1], b = dm.data[p + 2];
        masterLuma[i] = r > g ? (r > b ? r : b) : (g > b ? g : b);
      }
      log('drift comp ON (seeded, master from fresh grab)');
    }
    const bShifts = [];
    const loop = async () => {
      for (let k = 0; k < n; k++) {
        await grabTimeout();
        const tGrab = Date.now();
        if (comp && k > 0) {
          // luma of the just-grabbed frame (procCx holds it)
          const d = procCx.getImageData(0, 0, W, H);
          const cur = new Float32Array(W * H);
          for (let i = 0, p = 0; i < cur.length; i++, p += 4) {
            cur[i] = d.data[p] > d.data[p+1] ? (d.data[p] > d.data[p+2] ? d.data[p] : d.data[p+2])
                                             : (d.data[p+1] > d.data[p+2] ? d.data[p+1] : d.data[p+2]);
          }
          // seeded estimate: frame k vs MASTER, seeded by T_{k-1}
          const prev = bShifts[bShifts.length - 1] || { dx: 0, dy: 0 };
          const pre = new Float32Array(cur.length);
          // integer pre-shift via sampling (sub-px remainder goes to phase corr)
          const rdx = Math.round(prev.dx), rdy = Math.round(prev.dy);
          for (let y = 0; y < H; y++) {
            const sy = y + rdy;
            if (sy < 0 || sy >= H) continue;
            for (let x = 0; x < W; x++) {
              const sx = x + rdx;
              if (sx < 0 || sx >= W) continue;
              pre[y * W + x] = cur[sy * W + sx];
            }
          }
          const rem = phaseCorrJS(masterLuma, pre);   // remainder estimate
          const tot = { dx: rdx + rem.dx, dy: rdy + rem.dy, conf: rem.conf };
          bShifts.push(tot);
          // CORRECT the stored frame: warp the ORIGINAL frame back by -tot
          benchCaptureComp('burst:f' + k, tot);
        } else {
          bShifts.push({ dx: 0, dy: 0 });
          benchCapture('burst:f' + k);
        }
        gts.push(tGrab);
        if (abortFlag) break;
        // pace: wait until gap ms after the PREVIOUS grab started
        const target = gts[gts.length - 1] + gap;
        while (Date.now() < target) await sleep(5);
      }
    };
    await loop();
    const iv = [];
    for (let i = 1; i < gts.length; i++) iv.push(gts[i] - gts[i - 1]);
    iv.sort((a, b) => a - b);
    const med = iv.length ? iv[iv.length >> 1] : 0;
    const fps = med > 0 ? 1000 / med : 0;
    benchStats = { build: BUILD, n: gts.length, gap_cfg: gap,
                   med_ms: med, min_ms: iv.length ? iv[0] : 0,
                   max_ms: iv.length ? iv[iv.length - 1] : 0,
                   fps: Math.round(fps * 100) / 100,
                   comp: comp ? 1 : 0,
                   shifts: bShifts };
    log('burst stats: n=' + benchStats.n + ' med ' + med + 'ms (' + benchStats.fps +
        ' fps) min/max ' + benchStats.min_ms + '/' + benchStats.max_ms +
        (comp ? ' comp residual max ' + (bShifts.slice(1).reduce((m, s) => Math.max(m, Math.abs(s.dx) + Math.abs(s.dy)), 0)).toFixed(2) + 'px' : ''));
    await paint({ cmd: 'black' });
  } catch (e) { log('E burst ' + (e && e.message || e)); }
  benchRunning = false;
}
async function benchPull() {
  if (benchPulling) return;
  benchPulling = true;
  try {
    await sendCmd({ cmd: 'logc', d: 'BSTATS ' + JSON.stringify(benchStats || {}) }, { tries: 2, timeout: 2000 });
    await sleep(30);
    log('bench pull: ' + benchStore.length + ' frames');
    for (const f of benchStore) {
      const meta = JSON.stringify({ t: f.t, label: f.label, W: f.W, H: f.H, exp: f.exp });
      await sendCmd({ cmd: 'logc', d: 'FRAME ' + meta }, { tries: 2, timeout: 2000 });
      await sleep(30);
      for (let i = 0; i < f.jpg.length; i += 900) {
        await sendCmd({ cmd: 'logc', d: 'FJPEG ' + f.jpg.slice(i, i + 900) }, { tries: 2, timeout: 2000 });
        await sleep(20);
      }
      await sendCmd({ cmd: 'logc', d: 'FEND' }, { tries: 2, timeout: 2000 });
      await sleep(30);
      if (abortFlag) break;
    }
    await sendCmd({ cmd: 'logend' }, { tries: 2, timeout: 2000 });
    log('bench pull done');
  } catch (e) { log('E benchpull ' + (e && e.message || e)); }
  benchPulling = false;
}
